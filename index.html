"Pilihan – Paket 1":[
{s:"hik",i:"Urutan peristiwa",q:"Urutan peristiwa yang tepat sesuai dengan isi hikayat tersebut adalah ….",o:["Raja Ikan Todak muncul — Datu Mabrur dan Raja Ikan Todak berkelahi — Raja Ikan Todak menyerah — perjanjian disepakati","Raja Ikan Todak menyerang — Raja Ikan Todak menyerah — Datu Mabrur bertapa — laut menjadi tenang kembali","Ribuan ikan mengepung — Raja Ikan Todak menyerang — Datu Mabrur mengusulkan perjanjian — perjanjian disepakati","Raja Ikan Todak menyerang — Datu Mabrur menolong Raja Ikan Todak — ikan-ikan mengepung — perjanjian dibuat","Raja ikan menyerang Datu Mabrur — Datu Mabrur mengusulkan perjanjian — perjanjian dibuat — Raja Ikan Todak mengiba"],k:[0]},
{s:"hik",i:"Konflik utama",q:"Peristiwa penting yang terjadi setelah Datu Mabrur menolong Raja Ikan Todak adalah ….",o:["Raja Ikan Todak melanggar janjinya dan kembali menyerang","Datu Mabrur meminta harta dan singgasana bawah laut","Raja Ikan Todak berjanji akan memenuhi permintaan Datu Mabrur","Datu Mabrur mengajak semua ikan menyerang kerajaan manusia","Raja Ikan Todak mengangkat Datu Mabrur menjadi raja laut"],k:[2]},
{s:"hik",i:"Menilai tindakan tokoh",c:["Menggambarkan sikap balas budi terhadap orang yang telah berjasa dalam hidup kita","Menunjukkan sikap suka menolong terhadap semua orang yang membutuhkan pertolongan","Mencerminkan sikap pandai berterima kasih terhadap orang yang telah menolong."],k:[1,0,1],cl:["Benar","Salah"],q:"Mengapa tindakan Raja Ikan Todak yang ingin mengerahkan rakyatnya untuk memenuhi permintaan Datu Mabrur masih relevan dengan norma sosial saat ini? Klik pada pilihan Benar atau Salah untuk setiap pernyataan berikut!"},
{s:"pah",i:"Makna lirik",q:"Mengapa larik “Dia tidak tahu untuk siapa dia datang” sudah tepat menguatkan gambaran tentang pahlawan?",o:["Latar belakang daerah tidaklah penting untuk menjadi pahlawan","Seorang pejuang tidak memerlukan bantuan dari pihak mana pun","Pengorbanan dilakukan untuk tanah air bukan untuk orang tertentu","Figur pejuang sering kali tidak dihargai oleh generasi muda saat ini","Gambaran ketidaktahuan kita dalam menghormati seorang pahlawan"],k:[2]},
{s:"pah",i:"Majas",m:1,q:"Mengapa penyair menggunakan majas repetisi (pengulangan) pada bait awal dan akhir puisinya? (Jawaban benar lebih dari satu.)",o:["Menguatkan gambaran tentang pahlawan yang tewas tertembak","Menguatkan tentang adanya perjuangan di Batavia pada masa itu","Menegaskan tentang adanya pahlawan yang gugur demi tanah air","Menggambarkan kondisi peperangan yang pecah pada masa itu","Mengisyaratkan pengorbanan pahlawan yang tewas tanpa tanda jasa"],k:[0,2,4]},
{s:"pah",i:"Citraan dan simbol",q:"Makna simbolik pada larik “Sambil merangkai karangan bunga” pada puisi tersebut adalah ….",o:["Menyusun bunga untuk orang yang dicintai","Menghormati jasa para pahlawan yang gugur","Menaruh hormat pada setiap orang yang ditemui","Menghargai nilai keindahan yang ada pada bunga","Menata beberapa tangkai bunga untuk pahlawan"],k:[1]},
{s:"tan",i:"Pemecahan masalah",q:"Setelah memahami fenomena dalam teks, bagaimana kalimat yang tepat untuk menyampaikan pemecahan masalah?",o:["Meningkatnya urbanisasi harus dibiarkan agar masyarakat kota terbiasa dengan keterbatasan pangan.","Ketergantungan kota pada pasokan luar dapat dikurangi dengan menerapkan pertanian vertikal di ruang terbatas.","Krisis pangan di kota besar tidak perlu dikhawatirkan karena dapat diatasi dengan menambah impor bahan pangan.","Pembangunan kota harus diutamakan dibanding penyediaan ruang untuk pertanian atau tanaman pangan.","Penduduk kota harus dibiasakan untuk mengurangi konsumsi makanan segar dan beralih ke makanan instan."],k:[1]},
{s:"tan",i:"Ketepatan bahasa",q:"Cermati paragraf 1 kalimat 1!<br>Mengapa frasa “urbanisasi yang terjadi secara masif” tepat sebagai pengisi fungsi subjek?",o:["Menyatakan akibat dari suatu peristiwa","Berbentuk verba yang menempati posisi predikat","Merupakan frasa kerja yang menjelaskan objek","Berbentuk frasa nomina dan berperan sebagai pelaku","Mengandung keterangan tempat yang lengkap"],k:[3]},
{s:"tan",i:"Kelogisan istilah",m:1,q:"Mengapa penggunaan istilah “urbanisasi” tepat digunakan dalam teks tersebut? (Jawaban benar lebih dari satu.)",o:["Berhubungan dengan peningkatan jumlah penduduk di wilayah perkotaan","Menunjukkan metode pertanian modern yang cocok diterapkan di kota","Menyebabkan tantangan serius dalam penyediaan pangan di kota","Menjadi pemicu perlu adanya inovasi, seperti pertanian vertikal","Menjelaskan cara pendistribusian hasil pangan dari desa ke kota"],k:[0,2,3]},
{s:"mis",i:"Konstruksi kebahasaan",q:"Perhatikan kalimat berikut!<br><i>Agar sejahtera, masyarakat mesti melepaskan dari kemiskinan.</i><br>Mengapa konstruksi frasa verba “mesti melepaskan” tidak sesuai dengan konteks kalimat tersebut?",o:["Kata <i>melepaskan</i> merupakan verba transitif yang memerlukan objek langsung","Seharusnya kata <i>mesti</i> tidak perlu digunakan dalam konstruksi frasa tersebut","Frasa <i>mesti melepaskan</i> bukanlah frasa verba karena memiliki inti nomina","Frasa <i>mesti melepaskan</i> bukanlah frasa verba tidak hanya menduduki satu fungsi","Kata <i>melepaskan</i> sudah tepat penggunaannya tanpa perlu tambahan objek"],k:[0]},
{s:"mis",i:"Parafrasa tabel",q:"Pernyataan paling tepat berdasarkan informasi tabel dalam teks tersebut adalah ….",o:["Jumlah penduduk miskin di Indonesia terus mengalami peningkatan sejak tahun 2020 hingga tahun 2024.","Persentase penduduk miskin tertinggi terjadi pada tahun 2022, yaitu sebesar 9,57% dari tahun sebelumnya.","Penurunan jumlah penduduk miskin paling besar terjadi antara tahun 2023 dan 2024, yaitu sebesar 1,84 juta jiwa.","Jumlah penduduk miskin pada tahun 2021 lebih tinggi dibandingkan tahun 2020, yaitu 26,50 juta jiwa.","Jumlah penduduk miskin pada tahun 2022 mengalami peningkatan sebesar 1,35 juta jiwa dibandingkan tahun 2020."],k:[2]},
{s:"mis",i:"Argumen dan data",m:1,q:"Perhatikan kalimat berikut!<br><i>Meski demikian, bantuan sosial saja tak cukup untuk membuat kemiskinan menjauh.</i><br>Mengapa kalimat argumentasi tersebut sesuai dengan data yang diberikan penulis dalam teks? (Jawaban benar lebih dari satu.)",o:["Bantuan sosial belum mampu menurunkan angka kemiskinan secara signifikan","Bantuan sosial yang diberikan tidak menyentuh akar persoalan kemiskinan","Bantuan sosial harus dikombinasikan dengan pendidikan dan pemberdayaan ekonomi","Bantuan sosial menciptakan ketergantungan yang justru memperpanjang kemiskinan","Bantuan sosial membuat masyarakat memiliki kemandirian untuk lepas dari kemiskinan"],k:[0,1,2]},
{s:"bat",i:"Tanggapan sesuai norma",q:"Berdasarkan teks tersebut, manakah tanggapan yang sesuai dengan norma sosial dan budaya?",o:["Sudah saatnya Indonesia menetapkan batik sebagai pakaian resmi dalam berbagai forum formal.","Penurunan suhu ruangan satu derajat celcius bisa menghasilkan emisi 160 kg CO₂ per tahun.","Di negara tropis, pengaturan suhu yang terlalu rendah dapat menyebabkan pemborosan energi.","Menurut ASHRAE, pakaian dengan nilai clo rendah tidak cocok untuk suhu ruang yang disetel dingin.","Peserta dari negara empat musim kedinginan di ballroom hotel, meskipun berasal dari negara dingin."],k:[0]},
{s:"bat",i:"Unsur kalimat",q:"“Dengan memilih batik, kita tidak hanya melestarikan budaya, tetapi juga mengambil langkah konkret dalam menjaga bumi bagi generasi mendatang.”<br>Makna kalimat tersebut diperjelas melalui penggunaan unsur kalimat berupa ….",o:["penggunaan majas hiperbola untuk memberikan efek dramatis","pengulangan frasa inti untuk penekanan maksud pertanyaan","penempatan subjek utama di awal kalimat untuk fokus aksi","penggunaan pola hubungan sebab-akibat untuk penjelasan utama","penggunaan konjungsi korelatif untuk menghubungkan dua manfaat"],k:[4]},
{s:"bat",i:"Logika berpikir",c:["Penggunaan pakaian ringan seperti batik dapat mengurangi kebutuhan energi untuk pendingin ruangan.","Penggunaan jas dalam acara resmi di Indonesia perlu dipertahankan karena sudah menjadi standar formal.","Penggunaan batik sebagai pakaian resmi hanya berdampak pada pelestarian budaya, bukan pada isu lingkungan."],k:[1,0,0],cl:["Benar","Salah"],q:"Manakah pernyataan berikut yang menunjukkan pandangan logis berdasarkan isi teks? Klik pada pilihan Benar atau Salah untuk setiap pernyataan berikut!"},
{s:"inf",i:"Konstruksi frasa",q:"Frasa “tekanan inflasi dari kejutan di sisi pasokan” merupakan frasa yang kompleks.<br>Manakah analisis konstruksi frasa yang paling tepat untuk frasa tersebut?",o:["Frasa “tekanan inflasi” merupakan frasa nomina, sedangkan frasa “dari kejutan” dan “di sisi pasokan” merupakan frasa pronomina.","Frasa “tekanan inflasi” merupakan frasa nomina, sedangkan frasa “dari kejutan” dan “di sisi pasokan” merupakan frasa preposisional.","Frasa “tekanan inflasi” merupakan frasa pronomina, sedangkan frasa “dari kejutan” dan “di sisi pasokan” merupakan frasa preposisional.","Frasa “tekanan inflasi” merupakan frasa preposisional, sedangkan frasa “dari kejutan” dan “di sisi pasokan” merupakan frasa preposisional.","Frasa “tekanan inflasi” merupakan frasa verba, sedangkan frasa “dari kejutan” dan “di sisi pasokan” merupakan frasa preposisional."],k:[1]},
{s:"inf",i:"Parafrasa tabel",q:"Manakah pernyataan berikut yang paling tepat menggambarkan isi tabel secara logis dan informatif?",o:["Tabel menunjukkan bahwa seluruh kota besar di Indonesia memiliki bobot inflasi yang merata, dengan rata-rata sekitar 3%.","Bobot inflasi kota Jakarta paling tinggi dibandingkan kota lainnya, yaitu mencapai 22,49%, lebih dari tiga kali lipat bobot inflasi Surabaya.","Tabel menunjukkan bahwa gabungan kota selain Jakarta menyumbang bobot inflasi yang lebih rendah daripada Jakarta sendiri.","Data menunjukkan bahwa inflasi di Pulau Jawa secara keseluruhan menyumbang hampir 90% dari bobot inflasi nasional.","Data menunjukkan bahwa inflasi di Pulau Jawa secara keseluruhan menyumbang hampir 90% dari bobot inflasi nasional."],k:[1]},
{s:"inf",i:"Kelogisan argumen",m:1,q:"Manakah pernyataan berikut yang berkaitan dengan argumentasi dan data pada teks tersebut? (Jawaban benar lebih dari satu.)",o:["Kajian mengenai persistensi inflasi penting dilakukan agar kebijakan moneter mampu mendukung pertumbuhan ekonomi secara berkelanjutan.","Jakarta dipilih sebagai fokus studi karena pergerakan distribusi barang kebutuhan pokok di kota ini tergolong rendah dan stabil.","Bobot inflasi Jakarta mencapai 22,49% berdasarkan SBH 2007, menjadikannya kota dengan pengaruh tertinggi terhadap inflasi nasional.","Kebijakan moneter tidak cukup untuk mengatasi tekanan inflasi yang berasal dari sisi pasokan sehingga diperlukan strategi sektoral dan regional.","Seluruh studi mengenai persistensi inflasi di Indonesia selama ini sudah menyertakan data dari daerah, termasuk kota Jakarta dan kota-kota besar lainnya."],k:[0,2,3]},
{s:"wm",i:"Nilai sosial antarteks",q:"Persamaan nilai sosial yang terkandung dalam kedua kutipan wacana tersebut adalah ….",o:["pentingnya kekuatan hukum dalam menyelesaikan konflik pribadi maupun keluarga","perlunya ketegasan dalam mempertahankan harga diri sebagai bangsa yang merdeka","perilaku tidak adil terhadap pihak yang lemah dan refleksi moral terkait kemanusiaan","perbedaan budaya yang menyebabkan kesalahpahaman antarnegara dan antarmanusia","kepasrahan sebagai bentuk penerimaan terhadap takdir yang tidak dapat dihindari"],k:[2]},
{s:"wp",i:"Nilai sosial antarteks",q:"Persamaan nilai sosial yang terkandung dalam kedua kutipan wacana tersebut adalah ….",o:["keberanian tokoh dalam melanggar norma demi kepentingan pribadi","keputusan tokoh untuk mengorbankan kepentingan orang lain demi cita-cita yang besar","kebesaran hati tokoh untuk menghadapi situasi yang sulit demi kepentingan bersama","ketaatan tokoh terhadap sistem agar tetap aman secara sosial dan ekonomi","sikap tokoh yang memendam masalah pribadi tanpa mencari solusi"],k:[2]},
{s:"pan",i:"Parafrasa data tabel",m:1,q:"Manakah paragraf singkat yang menjelaskan informasi berdasarkan tabel pada wacana 2? (Jawaban benar lebih dari satu.)",o:["Pengunjung hanya perlu membayar tiket masuk pantai sebesar Rp10.000,00 per orang, yang sudah termasuk biaya parkir. Bagi pengunjung yang ingin mencoba wahana air seru, tersedia <i>banana boat</i> dengan tarif Rp200.000,00 untuk empat orang. Kemudian, ada sewa perahu kayu untuk keliling pantai seharga Rp20.000,00 per orang.","Untuk masuk ke kawasan pantai, pengunjung cukup membayar Rp10.000,00 per orang dan belum termasuk biaya parkir. Bagi pecinta wahana air, tersedia <i>banana boat</i> yang dapat dinikmati lima orang dengan tarif Rp200.000,00. Selain itu, ada perahu kayu yang bisa disewa seharga Rp20.000,00 per orang untuk berkeliling di sekitar pantai.","Tiket masuk ke kawasan pantai ini hanya Rp10.000,00 per orang, sudah termasuk biaya parkir. Ada <i>banana boat</i> yang dapat dinaiki lima orang dengan tarif Rp200.000,00 bagi pengunjung yang suka bermain air. Lalu, ada juga penyewaan perahu kayu untuk keliling pantai seharga Rp20.000,00 per orang.","Pengunjung cukup membayar tiket masuk pantai sebesar Rp10.000,00 per orang yang termasuk biaya parkir kendaraan. Bagi pecinta aktivitas air, tersedia wahana <i>banana boat</i> untuk lima orang seharga Rp200.000,00. Di sana, tersedia juga jasa sewa perahu kayu untuk keliling pantai seharga Rp25.000,00 per orang.","Dengan membayar Rp10.000,00 per orang dan sudah termasuk biaya parkir, pengunjung sudah bisa masuk ke area pantai. Di sana, juga tersedia wahana <i>banana boat</i> seharga Rp200.000,00 untuk lima orang. Ada juga penyewaan perahu kayu untuk keliling pantai dengan tarif Rp20.000,00 per orang."],k:[2,4]},
{s:"wm",i:"Logika berpikir",c:["Menjunjung nilai perjuangan yang bermartabat.","Menunjukkan sikap kritis terhadap ketidakadilan sosial.","Mengedepankan kehormatan orang lain daripada sendiri."],k:[1,1,0],cl:["Benar","Salah"],q:"Dalam kutipan novel Bumi Manusia, tokoh Mama menyampaikan “Kita telah melawan, Nak, sebaik-baiknya, sehormat-hormatnya.” Mengapa tindakan tersebut relevan dengan norma sosial masyarakat saat ini? Klik pada pilihan Benar atau Salah untuk setiap pernyataan berikut!"},
{s:"wp",i:"Logika berpikir",c:["Masyarakat cenderung mengutamakan keamanan posisi masing-masing daripada idealisme.","Masyarakat saat ini sangat mendambakan nilai kejujuran dan transparansi ketika bekerja.","Masyarakat modern berani untuk menolak sistem yang merugikan masyarakat."],k:[0,1,1],cl:["Benar","Salah"],q:"Dalam kutipan novel Orang-Orang Proyek, Sugeng memilih untuk tidak menandatangani laporan palsu, meskipun hal itu membuat posisinya di proyek terancam. Mengapa tindakan tersebut relevan dengan norma sosial masyarakat saat ini? Klik pada pilihan Benar atau Salah untuk setiap pernyataan berikut!"},
{s:"pan",i:"Simpulan data tabel",q:"Apa simpulan yang didapatkan dari tabel pada wacana 2?",o:["Pantai Karang Jahe memiliki berbagai fasilitas dan wahana dengan jumlah yang banyak.","Fasilitas dan wahana yang disediakan pengelola Pantai Karang Jahe berbayar semua.","Pengunjung Pantai Karang Jahe wajib memesan wahana yang disediakan oleh pengelola.","Pantai Karang Jahe memiliki pendapatan yang cukup memadai dari hasil penyewaan.","Wahana Pantai Karang Jahe dapat disewa oleh pengunjung pantai dengan sistem paket."],k:[1]},
{s:"pan",i:"Kelogisan pernyataan",c:["Para pengunjung Pantai Karang Jahe wajib akan mencoba semua wahana yang ada di sana.","Pantai Karang Jahe menjadi tujuan favorit pengunjung untuk berekreasi bersama keluarga.","Pantai Karang Jahe akan banyak dikunjungi karena harga tiket masuknya yang terjangkau."],k:[0,1,1],cl:["Benar","Salah"],q:"Pernyataan manakah yang secara logis sesuai dengan isi ulasan para pengunjung pada wacana pertama? Klik pada pilihan Benar atau Salah untuk setiap pernyataan berikut!"},
{s:"wm",i:"Respons emosional",q:"Respons emosional tokoh Aku pada wacana 2 terhadap peristiwa yang dialami adalah ….",o:["kecewa dan menyerah sepenuhnya tanpa merasa telah berbuat apa-apa","marah karena merasa dikhianati oleh orang yang sangat mereka percayai","sedih karena merasa telah gagal atas usaha yang sudah dilakukan","putus asa dan merasa perjuangan untuk Anneliese sudah sia-sia sejak awal","terhormat dengan tidak menunjukkan emosi atas kekalahan yang dialami"],k:[2]},
{s:"wp",i:"Respons emosional",q:"Respons emosional tokoh Salva terhadap peristiwa kehilangan dan penderitaan masa kecilnya adalah ….",o:["tenggelam dalam trauma masa kecilnya dan menolak kembali ke masa lalu","kecewa dan membalas dengan menyalahkan sistem dan masyarakat sekitar","membangun kekuatan dari pengalaman pahit dan memilih untuk memberi","mencari validasi dari orang luar atas penderitaan yang dialaminya pada masa kecil","menggunakan penderitaannya sebagai alasan untuk tidak bertanggung jawab"],k:[2]},
{s:"pan",i:"Kesesuaian antarteks",q:"Manakah pernyataan berikut yang menunjukkan kesesuaian informasi pada kedua wacana tersebut?",o:["Kedua wacana membahas kemudahan akses jalan ke Pantai Karang Jahe sehingga direkomendasikan bagi keluarga yang mempunyai kendaraan pribadi.","Kedua wacana menjelaskan keadaan Pantai Karang Jahe yang asri dengan fasilitas memadai sehingga menjadikannya pilihan untuk bersantai dengan sanak famili.","Wacana 1 dan 2 menyebutkan rincian biaya akomodasi yang ada di Pantai Karang Jahe yang memudahkan bagi pembaca yang ingin mengunjungi pantai tersebut.","Wacana 1 dan 2 menyebutkan secara langsung bahwa Pantai Karang Jahe dapat dinikmati oleh sahabat ataupun keluarga besar dengan banyak anggota keluarga.","Baik wacana 1 maupun 2 menjelaskan hamparan pasir putih yang terbentang di Pantai Karang Jahe menjadi ciri khas tersendiri dari pantai-pantai lain di Pulau Jawa."],k:[1]},
{s:"wm",i:"Respons emosional",q:"Apa yang dirasakan tokoh ketika berada dalam suasana seperti yang dideskripsikan dalam wacana 1 paragraf terakhir?",o:["Menyesal karena hanya berhasil menawar ongkos taksi hingga 1,5 lira saja.","Marah karena merasa telah ditipu oleh sopir taksi asing dengan harga 3 lira.","Merasa menyesal atas tindakan yang telah mereka lakukan kepada sopir taksi.","Tidak peduli dengan perasaan sopir karena merasa lokasi tidak sesuai kesepakatan.","Yakin bahwa tindakan mereka sudah sesuai dengan budaya warga setempat."],k:[2]},
{s:"wp",i:"Respons emosional",q:"Apa yang dirasakan Sugeng ketika menghadapi suasana proyek yang penuh penyimpangan?",o:["Marah dan langsung menunjukkan sikap penolakan tegas.","Takut dan memutuskan meninggalkan proyek secara diam-diam.","Biasa saja karena kondisi seperti itu dianggap wajar dalam dunia kerja.","Merasa bersalah dan akhirnya memilih diam demi keluarga.","Gelisah dan memutuskan bertindak sesuai hati nuraninya"],k:[4]}],

"Pilihan – Paket 2":[
{s:"pb",i:"Pemahaman isi bacaan",c:["Semua petani merasa sukses ketika tanaman sudah menghasilkan.","Kerugian akibat benih palsu terlihat jika petani melakukan perhitungan terhadap hasil panen.","Kerugian akibat menggunakan benih palsu tidak selalu berupa tanaman tidak menghasilkan."],k:[0,1,1],q:"Tentukan SESUAI atau TIDAK SESUAI untuk setiap pernyataan berikut!"},
{s:"pb",i:"Koherensi antarparagraf",q:"Hubungan koherensi antara paragraf ke-2 dan ke-3 adalah ….",o:["alasan penggunaan benih palsu di Kabupaten di Sumatra Utara.","tujuan dari penggunaan benih palsu yang ternyata tidak sebanding dengan benih bermutu.","perbandingan hasil dari benih asalan dan benih bermutu.","akibat yang didapatkan dari benih palsu dan benih bermutu yang diambil dari penelitian.","asumsi benih palsu dapat menghasilkan buah."],k:[2]},
{s:"pb",i:"Memahami maksud kutipan",q:"Jika menggunakan benih bermutu, petani bisa meraih produksi hingga 20 ton/hektare/tahun sekalipun dengan pemeliharaan yang kurang baik. Produksi pun bisa mencapai 30 ton TBS/hektare/tahun, bahkan 35 ton TBS/hektare/tahun jika melakukan pemeliharaan yang intensif.<br><br>Maksud yang TIDAK TEPAT berdasarkan bacaan di atas adalah ….",o:["Petani dapat hasil yang baik jika menggunakan benih bermutu, bahkan dengan pemeliharaan yang kurang baik.","Produksi bisa mencapai 30 ton TBS/hektare/tahun sekalipun menggunakan benih asalan.","Produksi bisa mencapai 35 ton TBS/hektare/tahun jika melakukan pemeliharaan yang intensif.","Dengan benih bermutu, petani bisa mencapai produksi 35 ton TBS/hektare/tahun.","Jika melakukan pemeliharaan yang intensif, petani dapat meraih hasil yang baik."],k:[1]},
{s:"pb",i:"Makna tersirat",q:"Makna tersirat dalam bacaan tersebut relevan dengan ….",o:["Banyak petani yang selalu memilih benih sebelum bercocok tanam.","Banyak petani yang tidak memperhitungkan hasil panen dengan perbandingan antara menggunakan benih palsu dan benih berkualitas.","Jika menggunakan benih bermutu, petani dipastikan mendapat hasil produksi yang tinggi.","Petani baru menyadari bahwa kerugian akibat benih palsu telah terjadi setelah melakukan perhitungan detail.","Benih palsu dan benih bermutu tidak berdampak hasil signifikan."],k:[1]},
{s:"hu",i:"Makna kiasan",q:"<i>di batu penghabisan ke Huesca<br>batas terakhir dari kebangsaan kita.</i><br>Makna kiasan <i>batu penghabisan</i> dan <i>batas terakhir</i> memperjelas kondisi yang dialami aku lirik (penyair) tentang ….",o:["perpisahan antara penyair yang dengan orang yang dikasihi.","situasi kejiwaan yang penuh dinamika kehidupan.","setiap perjumpaan akan dibatasi dengan perpisahan.","semua ikhtiar harus dilakukan sampai batas kemampuan.","apa pun hasil akhirnya harus disikapi dengan kebanggaan."],k:[0]},
{s:"hu",i:"Citraan",q:"<i>angin bangkit ketika senja<br>ngingatkan musim gugur akan tiba</i><br>Makna citraan penglihatan ketika senja dan musim gugur mengonkretkan gagasan penyair tentang ….",o:["pergantian hari dan musim.","batas akhir aktivitas manusia.","suasana kedukaan di ujung waktu.","siap menghadapi perubahan waktu.","kondisi menjelang akhir kehidupan."],k:[4]},
{s:"hu",i:"Suasana",q:"<i>angin bangkit ketika senja<br>ngingatkan musim gugur akan tiba<br>aku cemas bisa kehilangan kau<br>aku cemas pada kecemasanku sendiri</i><br>Suasana hati yang muncul setelah membaca bait puisi tersebut adalah ….",o:["keriangan hati saat musim gugur sudah tiba.","kemuraman saat senja hari di musim gugur.","keadaan gersang karena daun berguguran.","kesedihan karena takut kehilangan orang terkasih.","kebimbangan hati menunggu pergantian musim."],k:[3]},
{s:"air",i:"Perbandingan dua teks",m:1,q:"Berdasarkan dua bacaan di atas, manakah hal yang bisa ditemukan pada Teks 1A dan Teks 1B? (Jawaban benar lebih dari satu.)",o:["Manfaat air bersih","Masalah keberadaan air bersih","Kelangkaan air bersih","Kegunaan air bersih","Cara memperoleh air bersih"],k:[0,3]},
{s:"air",i:"Kalimat majemuk",m:1,q:"Manakah kalimat yang merupakan kalimat majemuk setara dalam dua teks tersebut? (Jawaban benar lebih dari satu.)",o:["Tidak seperti halnya beberapa puluh tahun yang lalu, air bersih mudah diperoleh dan selalu berlimpah mengalir di setiap sudut tanah negeri kita ini.","Air akan membantu menjaga kulit agar tetap kenyal sehingga terlihat awet muda dan cantik alami.","Air dapat menurunkan berat badan karena tidak berkalori, bebas lemak, bebas kolesterol, dan rendah natrium.","Ini disebabkan karena pada waktu itu belum banyak terjadi polusi air dan udara.","Setiap hari kita membutuhkan air bersih untuk minum, sekaligus digunakan untuk memasak, mandi, mencuci dan sebagainya."],k:[0,4]},
{s:"air",i:"Perbandingan dua teks",c:["Teks 1A membahas air bersih<br>Teks 1B membahas kelangkaan air bersih","Teks 1A membahas kegunaan air bersih bagi kehidupan.<br>Teks 1B membahas faedah air bersih untuk tubuh.","Teks 1A membahas kelangkaan air bersih di kota-kota besar.<br>Teks 1B membahas fungsi air bersih untuk menurunkan berat badan."],k:[0,1,1],q:"Tentukan SESUAI dan TIDAK SESUAI pada setiap pernyataan berikut!"},
{s:"air",i:"Tanggapan",q:"Tidak seperti halnya beberapa puluh tahun yang lalu, air bersih mudah diperoleh dan selalu berlimpah mengalir di setiap sudut tanah negeri kita ini karena pada waktu itu belum banyak terjadi polusi air dan udara. Dari rasa dan warnanya pun saat ini berbeda, tidak sealami dulu karena polusi tersebut.<br><br>Manakah tanggapan yang tepat berdasarkan kutipan di atas?",o:["Perlu adanya kesadaran bahwa air bersih sekarang sudah mulai terpolusi dan tidak sealami dulu.","Kebutuhan akan air bersih perlu dijadikan bahasan penting dalam perkuliahan dan materi sekolah.","Agar tercipta kesadaran air bersih, diperlukan gerakan bersama antara pemerintah dan pemerhati lingkungan.","Banyak yang memengaruhi kualitas air bersih saat ini sehingga harus ada kebijakan pemerintah yang mengatur penggunaan air bersih bagi industri.","Elemen masyarakat dan pemerintah sudah sewajarnya memberikan perhatian dan tindakan nyata akan kualitas air bersih."],k:[0]},
{s:"air",i:"Simpulan dua bacaan",q:"Setelah memperhatikan dua bacaan di atas, opini yang PALING MUNGKIN merangkai simpulan kedua bacaan di atas adalah ….",o:["Perlu kesadaran kita untuk menjaga lingkungan agar tetap bersih dan menggunakan air sesuai dengan fungsinya, tidak menghambur-hamburkan dengan sesuka hati.","Perlu kesadaran masyarakat untuk menjaga lingkungan agar tetap bersih dan menggunakan air sesuai dengan fungsinya, tidak menghambur-hamburkan dengan sesuka hati.","Perlu kesadaran pemerintah untuk menjaga lingkungan agar tetap bersih dan menggunakan air sesuai dengan fungsinya, tidak menghambur-hamburkan dengan sesuka hati.","Perlu kesadaran orang pengusaha untuk menjaga lingkungan agar tetap bersih dan menggunakan air sesuai dengan fungsinya, tidak menghambur-hamburkan dengan sesuka hati.","Perlu kesadaran Anda untuk menjaga lingkungan agar tetap bersih dan menggunakan air sesuai dengan fungsinya, tidak menghambur-hamburkan dengan sesuka hati."],k:[0]},
{s:"km",i:"Informasi dalam bacaan",q:"Manakah pertanyaan yang jawabannya TIDAK terdapat pada bacaan tersebut?",o:["Mengapa definisi makna kesehatan mental sangat membatasi fitrah sebagai manusia?","Bagaimana syarat seseorang dinyatakan masih sehat mentalnya?","Siapa yang berani bersuara tentang kesehatan mental?","Apakah ada perbedaan antara literasi kesehatan mental laki-laki dan perempuan?","Apa hasil penelitian komunitas Halo Jiwa Indonesia?"],k:[0]},
{s:"km",i:"Makna frasa",q:"Frasa <i>kacamata orang awam</i> pada kalimat (5) paragraf terakhir dapat digantikan dengan kata ….",o:["pandangan orang paham","pemahaman orang gila","yang dilihat oleh orang luar biasa","sudut pandang orang kebanyakan","pengamatan orang banyak"],k:[3]},
{s:"km",i:"Parafrasa kalimat",q:"Beragam kasus bunuh diri di kalangan artis dan remaja, kasus perundungan dan dampaknya, serta penyintas depresi dan bipolar yang berani bersuara berhasil meningkatkan kesadaran masyarakat tentang kesehatan mental, khususnya di kalangan generasi Y dan Z sebagai generasi yang memasuki usia produktif saat ini.<br><br>Kutipan di atas dapat diungkapkan melalui kalimat ….",o:["Kalangan generasi Y dan Z memasuki usia produktif sehingga bisa bersuara dalam meningkatkan kesadaran masyarakat tentang kesehatan mental.","Beragam kasus bunuh diri sudah mulai menyinggung kalangan dari generasi Y dan Z sehingga mereka mulai berani bersuara untuk meningkatkan kesadaran masyarakat tentang kesehatan mental.","Kesehatan mental merupakan kasus yang berani disuarakan kalangan generasi Y dan Z dalam memasuki usia produktif saat ini.","Beragam kasus tentang kesehatan mental membuat kalangan generasi Y dan Z berani bersuara dalam meningkatkan kesadaran masyarakat.","Para penyintas depresi dan bipolar berani bersuara sehingga berhasil meningkatkan kesadaran tentang kesehatan mental di kalangan generasi Y dan Z."],k:[4]},
{s:"km",i:"Ejaan dan penulisan kata",c:["Kata <i>provinsi</i> pada kalimat (3) paragraf kedua.","Kata <i>didiagnosa</i> pada kalimat (4) paragraf ketiga.","Kata <i>kacamata</i> pada kalimat (5) paragraf ketiga."],k:[1,0,1],cl:["Tepat","Tidak tepat"],q:"Manakah kalimat yang memiliki penulisan kata yang tepat? Tentukan TEPAT atau TIDAK TEPAT pada setiap pernyataan berikut."},
{s:"ko",i:"Memahami isi teks",q:"Terkait pencegahan penyebaran korona di tempat kerja, tindakan di atas adalah ….",o:["meliburkan pekerja yang memiliki gejala terserang korona.","mengharuskan semua karyawan dan tamu mengenakan APD.","mengizinkan semua karyawan dan tamu mengenakan APD.","mengizinkan masuk tamu yang sudah melapor ke bagian penerimaan.","mewajibkan karyawan untuk membersihkan APD mereka dengan disinfektan."],k:[1]},
{s:"ko",i:"Asumsi",q:"Berdasarkan pernyataan dalam poin 6 dapat diasumsikan bahwa ….",o:["Pinjam-meminjam APD harus melalui kepala unit K3 sehingga dilarang meminjam APD.","Pekerja yang tidak mengenakan APD akan kena sanksi dari unit K3 karena tidak diperkenankan pinjam-meminjam.","Pekerja yang tidak mengenakan APD akan dipulangkan oleh unit K3 yang dapat meminjamkan APD.","Tidak boleh pinjam-meminjam APD. Unit K3 menyediakan APD dan peralatan lainnya","Unit K3 menjual APD dan peralatan lainnya sebagai akibat dilarangnya saling meminjam APD."],k:[3]},
{s:"ko",i:"Makna kata",q:"Kata <i>kontak</i> pada kalimat <i>Hindari kontak langsung dengan orang lain</i> memiliki makna ….",o:["bertemu","berhubungan","berbicara","berinteraksi","berkomunikasi"],k:[1]},
{s:"ko",i:"Kelogisan fakta dan alasan",c:["Fakta: menjaga jarak sejauh 2 meter dari orang lain.<br>Alasan: menghindari penyebaran korona yang dapat terjadi jika jarak berdekatan.","Fakta: dilarang masuk jika Anda dan anggota keluarga Anda memiliki gejala korona.<br>Alasan: dipastikan bahwa Anda terkena korona dan ini bisa merugikan orang lain.","Fakta: kenakan APD sesuai ketentuan.<br>Alasan: APD bisa menjadi alat penyebaran korona jika dipakai tidak sesuai."],k:[1,0,1],cl:["Logis","Tidak logis"],q:"Manakah pernyataan yang mengungkapkan kesesuaian antara fakta dan alasan yang logis dalam bacaan di atas? Tentukan LOGIS dan TIDAK LOGIS pada setiap pernyataan berikut!"},
{s:"bi",i:"Gagasan bacaan",q:"Berdasarkan pemahaman literasi pada bacaan di atas, dapat diketahui bahwa gagasan bacaan di atas adalah ….",o:["Kenaikan BI rate berdampak kepada keberlangsungan hidup masyarakat awam dan suku bunga utang pemerintah.","Kenaikan suku bunga acuan BI ini berdampak pada keberlangsungan hidup masyarakat awam dan suku bunga kredit perbankan.","Kenaikan BI rate merupakan bagian dari langkah untuk memitigasi risiko peningkatan inflasi inti dan ekspektasi inflasi akibat kenaikan BBM.","Kenaikan BI rate mematahkan ekspektasi pasar yang memperkirakan BI akan tetap mempertahankan suku bunga acuan.","Kenaikan suku bunga acuan yang dilakukan oleh BI berdampak kepada seluruh kalangan masyarakat."],k:[0]},
{s:"bi",i:"Sudut pandang penulis",q:"Menurut informasi dari bacaan tersebut, penulis akan setuju dengan pernyataan ….",o:["Kenaikan suku bunga acuan dilakukan untuk meningkatkan inflasi inti dan ekspektasi inflasi.","Sebelumnya, Bank Indonesia sudah pernah menaikkan suku bunga acuan (BI rate).","Peningkatan inflasi inti dan ekspektasi inflasi menyebabkan kenaikan harga BBM nonsubsidi.","Suku bunga acuan akan naik menyesuaikan suku bunga kredit perbankan.","Suku bunga acuan BI merupakan satu-satunya variabel penentu suku bunga utang pemerintah di SBN."],k:[1]},
{s:"bi",i:"Fakta dan opini",q:"Fakta yang bisa ditemukan dalam bacaan tersebut terdapat pada kalimat ….",o:["Setelah 45 bulan, Bank Indonesia (BI) kembali menaikkan suku bunga acuan (BI rate).","Kenaikan suku bunga acuan BI berdampak pada keberlangsungan hidup masyarakat awam.","Suku bunga kredit perbankan naik menyesuaikan suku bunga acuan sebesar 25 basis poin.","Masyarakat berpotensi menahan anggaran belanjanya akibat kenaikan suku bunga acuan.","Keinginan pemerintah untuk “menggairahkan” daya beli masyarakat bisa kembali tertekan."],k:[0]},
{s:"mt",i:"Pola pengembangan paragraf",c:["Paragraf (2) memiliki hubungan sebab-akibat dengan paragraf (1).","Paragraf (2) memaparkan contoh paragraf (1).","Paragraf (3) merupakan pembanding paragraf (2)."],k:[0,1,0],cl:["Benar","Salah"],q:"Bagaimana pola pengembangan antarparagraf pada bacaan tersebut? Tentukan BENAR atau SALAH untuk setiap pernyataan berdasarkan bacaan!"},

const EXPLANATIONS={"1.1.1":"Kata aplikasi dan sistem tidak berasal dari bahasa Indonesia, tetapi diserap dari bahasa asing (Inggris/Belanda). Pasangan kata lainnya terbentuk dari kata dasar Indonesia.","1.1.2":"Gotong royong berasal dari bahasa Jawa dan fitur (feature) berasal dari bahasa Inggris, sehingga hanya pernyataan B dan D yang benar.","1.1.3":"Kata quality (Inggris) atau kwaliteit (Belanda) diserap ke dalam bahasa Indonesia menjadi kualitas sesuai kaidah penyerapan.","1.2.1":"Kosakata Dermaga Lama, senja merayap, bau garam dan solar, serta lampu perahu yang mulai dinyalakan menunjukkan latar dermaga pada senja hari dengan suasana tenang dan muram.","1.2.2":"Jari yang kasar, topi lusuh yang tetap dikenakan, serta ucapan \"tidak boleh menyerah\" menggambarkan tokoh yang gigih dan sabar.","1.2.3":"Lumbung digital, fitur prakiraan cuaca, dan aplikasi di ponsel langsung berkaitan dengan teknologi digital.","1.3.1":"Paragraf (1) memaparkan masalah, paragraf (2) dampak, paragraf (3) upaya, dan paragraf (4) perlunya perubahan kebiasaan masyarakat.","1.3.2":"Paragraf (2) menyebut tiga dampak, yaitu bagi lingkungan, kesehatan (mikroplastik), dan ekonomi (banjir).","1.3.3":"Butir yang layak masuk kerangka adalah butir yang mewakili isi paragraf 2, 3, dan 4 dalam teks.","2.1.1":"Seluruh paragraf membahas lumbung digital sebagai sarana yang membantu petani mengelola informasi pertanian. Pilihan lain hanya berupa rincian atau tidak ada dalam teks.","2.1.2":"Gagasan pendukung harus terdapat dalam teks dan menunjang ide pokok.","2.1.3":"Gelombang yang terlalu tinggi menghalangi Pak Darto melaut, tetapi ia tetap bertahan dan menambal jaring.","2.1.4":"Sikap Pak Darto yang sabar menambal jaring dan menolak menyerah menunjukkan nilai ketabahan dan pantang menyerah.","2.2.1":"Kalimat pertama menyatakan hal umum (dampak terasa pada banyak bidang), sedangkan kalimat kedua merinci dampak tersebut pada lingkungan.","2.2.2":"Kalimat kedua menyatakan kesulitan yang berlawanan dengan kesukaan pada kalimat pertama, sehingga digunakan penghubung pertentangan namun.","2.2.3":"Frasa Meskipun demikian pada paragraf (4) menandakan bahwa upaya pada paragraf (3) belum cukup tanpa perubahan kebiasaan masyarakat.","2.3.1":"Rani terdiam dan melihat ayahnya menjahit harapan, sehingga kelanjutan yang paling wajar adalah ia mendekat, membantu, dan memahami ayahnya.","2.3.2":"Penyebab utama kurang tidur adalah bermain ponsel hingga larut malam. Kelanjutan yang logis berupa saran membatasi penggunaan ponsel pada malam hari.","2.3.3":"Prediksi harus didukung petunjuk dalam teks: Pak Darto terus menambal jaring dan masih mengenakan topi melautnya, sedangkan Rani terdiam setelah mendengar ucapan ayahnya.","3.1.1":"Sikap tetap berusaha dan bersiap saat hasil belum tampak sejalan dengan siswa yang terus berlatih walaupun belum menang.","3.1.2":"Upaya yang diuraikan pada paragraf (3) adalah bank sampah, membawa botol minum sendiri, dan pembatasan kantong plastik.","3.1.3":"Teks memperlihatkan pemuda dan petani bekerja sama memanfaatkan teknologi untuk kebutuhan desanya sendiri.","3.2.1":"Rata-rata nilai tertinggi (82) dimiliki kelompok siswa yang tidur 7–8 jam, sedangkan kelompok yang tidur lebih dari 8 jam memperoleh 80.","3.2.2":"Klaim penyebab terbesar perlu didukung data perbandingan antarpenyebab, perbandingan antarkelompok, dan keterangan tentang responden agar data dapat dipercaya.","3.2.3":"Ringkasan yang baik hanya memuat informasi yang terdapat dalam teks. Teks tidak mewajibkan lama tidur tertentu.","3.3.1":"Nama bulan harus diawali huruf kapital, sehingga penulisan yang benar adalah Agustus.","3.3.2":"Menyisihkan berarti mengambil sebagian untuk keperluan tertentu, sesuai dengan konteks kalimat.","3.3.3":"Kalimat efektif tidak mengandung pemborosan kata (pleonasme) dan strukturnya jelas.","3.3.4":"Pengumuman resmi menggunakan kata baku dan kalimat lengkap tanpa kata percakapan.","3.4.1":"Ucapan Pak Darto tentang tidak boleh menyerah paling kuat menggambarkan karakternya yang gigih.","3.4.2":"Hanya kalimat ini yang menyatakan peristiwa (tidak dapat melaut) beserta penyebabnya.","3.4.3":"Latar mencakup tempat, waktu, dan suasana. Kutipan B dan D menggambarkan ketiganya, sedangkan kutipan lain berfokus pada tindakan atau watak tokoh.","3.5.1":"Citraan lampu bus seperti mata yang lelah dan ibu yang menggenggam tiket dan doa membangkitkan rasa iba dan haru.","3.5.2":"Ketabahan Pak Darto menghadapi kesulitan menimbulkan rasa kagum dan haru.","3.5.3":"Dialog ibu yang tetap bangga di tengah kekecewaan Dita menimbulkan rasa haru dan simpati."};

document.getElementById("g").onclick=()=>run(n,k,pk);return}

st.tm=setInterval(tick,1000);show()}

st.a[st.i]={r,ok};st.done=1;
const explanation=q.explain||"Pembahasan untuk paket ini belum tersedia.";
document.getElementById("f").innerHTML=`<section class="feedback ${ok?"good":"bad"}"><p class="${ok?"ok":"no"}" style="font-size:18px">${ok?"✓ Tepat! Jawaban Anda benar.":"✗ Belum tepat. Mari pelajari jawabannya."}</p><div class="answer-key"><b>🔑 Kunci jawaban</b><ul>${jawabanLengkap(q)}</ul></div><div class="explanation"><b>💡 Pembahasan</b><p>${esc(explanation)}</p></div></section>`;
document.getElementById("s").disabled=true;
document.querySelector(".actions").innerHTML=`<button onclick="next()">${st.i+1<st.Q.length?"Lanjut ke soal berikutnya →":"Lihat hasil tryout →"}</button>`}
function next(){st.i++;st.i<st.Q.length?show():finish()}
function kunci(q){if(q.c){const cl=q.cl||CL;return"Kunci: "+q.k.map(v=>cl[v?0:1]).join(" – ")}return"Kunci: "+q.k.map(x=>L[x]).join(", ")}
function finish(){clearInterval(st.tm);const n=st.Q.length,b=st.a.filter(x=>x&&x.ok).length,sk=Math.round(b/n*100),answered=st.a.filter(Boolean).length,wrong=answered-b;
$().innerHTML=`<div class="card hero"><span class="pill">TRYOUT SELESAI</span><h1>Hasil latihan: ${esc(st.n)}</h1><p class="m">${esc(st.k)} · ${esc(st.pk)}</p><div class="scoreline">${sk}<small> / 100</small></div><p>${sk>=80?"Bagus! Pertahankan pemahaman Anda dan baca kembali pembahasan soal yang masih keliru.":sk>=60?"Terus berlatih. Pelajari pembahasan untuk memperkuat pemahaman Anda.":"Jadikan hasil ini sebagai peta belajar. Baca pembahasan satu per satu, lalu coba lagi."}</p><div class="result-stats"><div class="stat"><strong>${b}</strong><span class="m">Benar</span></div><div class="stat"><strong>${wrong}</strong><span class="m">Salah</span></div><div class="stat"><strong>${n-answered}</strong><span class="m">Belum dijawab</span></div></div><p class="m">Skor dihitung dari jumlah soal yang dijawab benar. Buka setiap nomor di bagian tinjauan untuk melihat kunci dan pembahasan.</p><button onclick="start()">Kembali ke halaman awal</button></div><div class="card"><h2>Tinjau jawaban dan pembahasan</h2><p class="m">Pilih satu nomor untuk membuka kunci jawaban dan alasan jawabannya.</p><div class="review-list">${st.Q.map((q,j)=>{const a=st.a[j],state=a?(a.ok?"Benar":"Salah"):"Belum dijawab";return `<details class="review-item"><summary><span class="${a&&a.ok?"ok":a?"no":""}">Soal ${j+1} · ${state}</span> <span class="m">— ${esc(q.i||"")}</span></summary><p><b>${q.q}</b></p><p><b>Kunci jawaban:</b></p><ul>${jawabanLengkap(q)}</ul><p><b>Pembahasan:</b> ${esc(q.explain||"Pembahasan belum tersedia untuk paket ini.")}</p></details>`}).join("")}</div><button onclick="start()">Selesai · Kembali ke awal</button></div>`;window.scrollTo(0,0)}
start();
</script></body></html>
