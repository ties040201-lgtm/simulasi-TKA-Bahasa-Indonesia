/* ===== WAJIB PAKET 1 ===== */
w1a:`Teks 1 – Lumbung Digital Desa
Warga Desa Sukamaju kini memiliki lumbung digital. Melalui aplikasi di ponsel, petani dapat memantau stok gabah, harga pasar, dan jadwal panen. Program ini lahir dari semangat gotong royong: pemuda desa membangun sistem, sedangkan para petani memberikan data hasil panen secara rutin. Pengelola mengatakan bahwa efisiensi distribusi meningkat karena informasi dapat diakses kapan saja. Selain itu, sistem tersebut menyediakan fitur prakiraan cuaca sehingga petani dapat mengatur waktu tanam dengan lebih akurat.`,
w1b:`Teks 2 – Kutipan Cerpen “Jaring di Dermaga Lama”
Senja merayap di Dermaga Lama. Angin laut membawa bau garam dan solar, sementara lampu-lampu perahu mulai dinyalakan satu per satu. Pak Darto duduk bersila di ujung dermaga, jari-jarinya yang kasar sibuk menambal jaring yang robek. Sudah tiga hari ia tidak melaut karena gelombang terlalu tinggi, tetapi ia tetap mengenakan topi lusuhnya setiap pagi, seolah laut akan memanggilnya kapan saja.
“Bapak tidak capek?” tanya Rani sambil meletakkan sebungkus nasi.
“Capek itu wajar,” jawab Pak Darto tanpa menoleh. “Yang tidak boleh itu menyerah sebelum perahu ini benar-benar karam.”
Rani terdiam. Di kota, ia terbiasa meninggalkan sesuatu yang sulit. Kini ia melihat ayahnya menjahit harapan dengan sabar, simpul demi simpul, meskipun badai belum juga reda.`,

/* ===== WAJIB PAKET 2 ===== */
w2a:`Teks 1 – Pasar Rakyat Mulai Menerima Pembayaran Nontunai
Di Pasar Wage, para bakul kini tidak hanya menerima uang kertas. Di setiap lapak terpasang kode QR yang memungkinkan pembeli membayar melalui ponsel. Program ini diperkenalkan oleh pengelola pasar bersama sebuah bank daerah sebagai bagian dari inovasi pelayanan.
Menurut pengelola, transaksi nontunai membuat pencatatan penjualan lebih rapi sehingga pedagang dapat menghitung modal dan keuntungan dengan lebih akurat. Selain itu, pembeli tidak lagi kesulitan mencari uang kembalian. Meskipun demikian, sebagian pedagang lanjut usia masih memerlukan pendampingan agar terbiasa menggunakan sistem baru ini.`,
w2b:`Teks 2 – Kutipan Cerpen “Aroma Subuh di Dapur Bu Sari”
Pukul empat subuh, dapur rumah Bu Sari sudah mengepul. Aroma bawang goreng dan minyak panas memenuhi ruangan yang sempit itu. Tangan Bu Sari yang gemetar karena dingin tak berhenti membentuk adonan pisang goreng, sementara lampu neon di atas kepalanya berkedip-kedip lemah.
“Bu, Laras bantu ya,” kata Laras sambil mengucek mata.
“Tidur lagi saja, Nduk. Hari ini kamu ujian,” jawab Bu Sari tanpa menoleh. “Biar Ibu yang urus gorengan. Kamu cukup belajar yang rajin.”
Laras tidak beranjak. Ia melihat punggung ibunya yang melengkung, lalu menggenggam buku catatannya erat-erat. Hari ini, ia berjanji dalam hati, nilai terbaik harus menjadi hadiah bagi perempuan yang tak pernah mengeluh itu. Namun, listrik tiba-tiba padam, dan dapur itu jatuh dalam gelap.`,
w2c:`Teks 3 – Banjir Rob di Kota Pesisir
(1) Banjir rob kini menjadi langganan warga di sejumlah kota pesisir Indonesia. Air laut pasang menggenangi jalan dan permukiman, bahkan ketika hujan tidak turun.
(2) Penyebab banjir rob tidak tunggal. Permukaan laut naik akibat pemanasan global. Di sisi lain, tanah di wilayah pesisir turun karena air tanah diambil secara berlebihan. Alih fungsi hutan bakau menjadi tambak dan perumahan juga mengurangi penahan alami gelombang.
(3) Berbagai upaya ditempuh untuk menanggulanginya. Pemerintah membangun tanggul dan pompa air. Kelompok warga menanam bakau di sepanjang pantai. Sebagian kantor mulai membuat sumur resapan agar air hujan tidak langsung terbuang ke laut.
(4) Akan tetapi, pembangunan fisik saja tidak akan cukup. Warga perlu mengurangi penggunaan air tanah dan ikut menjaga bakau agar masalah ini tidak semakin parah.`,
w2d:`Teks 4 – Layanan Antar Buku dan Kunjungan Perpustakaan
Perpustakaan Daerah Banyuasri melaporkan bahwa jumlah kunjungan warga meningkat tajam sejak layanan antar buku diluncurkan pada awal tahun 2024. Pengelola menyimpulkan bahwa layanan tersebut merupakan penyebab utama meningkatnya minat baca di daerahnya. Pada tahun yang sama, perpustakaan juga menambah koleksi buku anak dan memperpanjang jam buka hingga pukul 20.00. Oleh karena itu, ...

/* ===== PILIHAN PAKET 1 ===== */
hik:`Hikayat Sa-ijaan dan Ikan Todak
Hatta, ketika laut tenang, seekor ikan besar tiba-tiba muncul dari permukaan laut dan terbang menyerangnya. Tanpa beringsut dari tempat duduk maupun membuka mata, Datu Mabrur menepis serangan mendadak itu. Ikan itu terpelanting dan jatuh di karang. Setelah jatuh ke air, ikan itu menyerang lagi. Demikian berulang-ulang. Di sekeliling karang, ribuan ikan lain mengepung, memperlihatkan gigi mereka yang panjang dan tajam, seakan prajurit siap tempur. Pada serangannya yang terakhir, ikan itu terpelanting jatuh persis saat Datu Mabrur membuka matanya.
“Hai, ikan! Apa maksudmu mengganggu samadiku? Ikan apa kamu?”
“Aku ikan todak, Raja Ikan Todak yang menguasai perairan ini. Samadimu membuat lautan bergelora. Kami terusik, dan aku memutuskan untuk menyerangmu. Tapi, engkau memang sakti, Datu Mabrur. Aku takluk,” katanya, megap-megap. Matanya berkedip-kedip menahan sakit. Tubuhnya terjepit di sela-sela karang tajam.
“Jadi, itu rakyatmu?” Datu Mabrur menunjuk ribuan ikan yang mengepung karang.
“Ya, Datu. Tapi, sebelum menyerangmu tadi, kami telah bersepakat. Kalau aku kalah, kami akan menyerah dan mematuhi apa pun perintahmu.” “Datu, tolonglah aku. Obati luka-lukaku dan kembalikanlah aku ke laut. Kalau terlalu lama di darat, aku bisa mati. Atas nama rakyatku, aku berjanji akan mengabdi padamu, bila engkau menolongku…” Raja Ikan Todak mengiba-iba. Seolah sulit bernapas, insangnya membuka dan menutup.
“Baiklah,” Datu Mabrur berdiri. “Sebagai sesama makhluk ciptaan-Nya, aku akan menolongmu.”
“Apa pun permintaanmu, kami akan memenuhinya. Datu ingin istana bawah laut yang terbuat dari emas dan permata, dilayani ikan duyung dan gurita? Ingin berkeliling dunia, bersama ikan paus dan lumba-lumba?”
“Tidak. Aku tak punya keinginan pribadi, tapi untuk masa depan anak-cucuku nanti….” Lalu, Datu Mabrur menceritakan maksud pertapaannya selama ini.
“Akan kukerahkan rakyatku, seluruh penghuni lautan dan samudera. Sebelum matahari terbit esok pagi, impianmu akan terwujud. Aku bersumpah!” jawab Raja Ikan Todak.
Datu Mabrur tak dapat membayangkan, bagaimana Raja Ikan Todak akan memenuhi sumpahnya itu. “Baiklah. Tapi kita harus membuat perjanjian. Sejak sekarang kita harus sa-ijaan, seiring sejalan. Seia sekata, sampai ke anak-cucu kita. Kita harus rakat mufakat, bantu membantu, bahu membahu. Setuju?”
“Setuju, Datu…,” sahut Raja Ikan Todak yang tergolek lemah.`,

tan:`Metode Bercocok Tanam di Lahan Sempit
Urbanisasi yang terjadi secara masif menimbulkan berbagai tantangan serius, terutama dalam hal penyediaan pangan dan keterbatasan lahan. Seiring dengan pertumbuhan populasi yang pesat, kebutuhan akan makanan segar meningkat, sementara lahan perkotaan semakin sempit karena dialokasikan untuk pembangunan infrastruktur, perumahan, dan fasilitas publik. Situasi ini menyebabkan ketergantungan tinggi pada pasokan dari luar kota yang rentan terhadap gangguan distribusi dan peningkatan biaya. Kondisi ini menuntut adanya inovasi dalam sistem produksi pangan agar kebutuhan masyarakat tetap terpenuhi. Perlu metode bercocok tanam yang dapat diterapkan di dalam ruang terbatas.
Inovasi metode bercocok tanam yang dapat mengatasi keterbatasan lahan di kota besar, yaitu pertanian vertikal. Metode ini dilakukan dengan menyusun tanaman dalam rak-rak bertingkat di lingkungan yang terkontrol. Metode ini memanfaatkan teknologi modern seperti hidroponik, aeroponik, dan pencahayaan LED. Sistem ini memungkinkan produksi pangan dilakukan dalam ruang terbatas secara efisien sehingga sangat cocok diterapkan di wilayah perkotaan. Selain menghemat lahan, pertanian vertikal juga dapat mengurangi penggunaan air, pestisida, serta tidak tergantung pada musim.
Namun demikian, pengembangan pertanian vertikal masih menghadapi sejumlah tantangan. Biaya awal pembangunan fasilitas ini tergolong tinggi karena membutuhkan peralatan canggih seperti sistem irigasi otomatis, kontrol suhu, dan pencahayaan khusus. Selain itu, konsumsi energi yang tinggi menjadi isu penting, meskipun teknologi energi terbarukan seperti panel surya mulai digunakan untuk mengatasi hal ini.
Indonesia sebagai negara dengan jumlah penduduk yang besar dan tingkat urbanisasi yang terus meningkat memiliki potensi dalam pengembangan pertanian vertikal. Kota-kota besar seperti Jakarta, Surabaya, dan Bandung menghadapi tekanan besar dalam pemenuhan kebutuhan pangan masyarakatnya. Pertanian vertikal bukan hanya sekadar solusi teknis, melainkan juga mencerminkan perubahan cara pandang dalam memproduksi pangan secara berkelanjutan. Dengan dukungan teknologi dan kreativitas, pertanian vertikal dapat menjadi jalan menuju masa depan yang lebih tangguh dalam menghadapi tantangan urbanisasi dan krisis pangan global.`,
mis:`Beranjak dari Kemiskinan
Sejauh mana masyarakat bisa memenuhi hak-hak dasar dan mengakses sumber daya? Kedua hal itu berkaitan dengan kemiskinan dan ketimpangan. Menurut Badan Pusat Statistik (BPS), nilai rasio Gini, yang berkaitan dengan ketimpangan pengeluaran, berkisar 0-1. Nilai 0 artinya setiap orang atau kelompok menerima pendapatan yang sama. Adapun rasio Gini 1 artinya ketimpangan pendapatan timpang sempurna atau pendapatan hanya diterima satu orang atau kelompok. Rasio Gini mendekati 1 menunjukkan kondisi yang kian timpang. Di Indonesia, rasio Gini pada tahun 2024 sebesar 0,381. Berikut tabel yang menjelaskan angka kemiskinan di Indonesia dalam 5 tahun terakhir.
<table><tr><th>Tahun</th><th>Jumlah Penduduk Miskin</th><th>Persentase Penduduk Miskin</th></tr><tr><td>2020</td><td>27,55 juta</td><td>10,19 %</td></tr><tr><td>2021</td><td>26,50 juta</td><td>9,71 %</td></tr><tr><td>2022</td><td>26,35 juta</td><td>9,57 %</td></tr><tr><td>2023</td><td>25,90 juta</td><td>9,36 %</td></tr><tr><td>2024</td><td>24,06 juta</td><td>8,57 %</td></tr></table><i>Tabel Angka Kemiskinan di Indonesia dalam 5 Tahun Terakhir</i>
Seseorang dikatakan miskin jika pengeluaran per kapita per bulan di bawah garis kemiskinan. Garis kemiskinan berupa nilai pengeluaran minimal, yang terdiri dari kebutuhan makanan dan bukan makanan, yang harus dipenuhi agar tidak dikategorikan miskin. Pada September 2024, garis kemiskinan Rp595.242,00 per kapita per bulan. Sementara menurut Bank Dunia, garis kemiskinan bagi negara berpendapatan menengah ke atas adalah 6,85 dollar AS per kapita per hari. Dengan nilai tukar Rp15.000,00 per dollar AS, nilai tersebut setara Rp102.750,00. Adapun garis kemiskinan ekstrem 2,15 dollar AS per kapita per hari atau Rp32.250,00. Di perkotaan dan perdesaan Indonesia, beras berkontribusi 20-an persen terhadap garis kemiskinan atau sebagai komoditas yang berperan paling besar. Maka, harga beras berpengaruh signifikan terhadap kemampuan masyarakat membeli kebutuhan makanan dan bukan makanan.
Harga kebutuhan makanan dan bukan makanan memengaruhi kemampuan masyarakat membeli barang. Di sisi lain, pendapatan yang tiba-tiba hilang akibat pemutusan hubungan kerja mengakibatkan masyarakat tak mampu memenuhi kebutuhan hidup. Tanpa tabungan dan aset memadai, masyarakat yang kehilangan pekerjaan bisa jatuh miskin. Negara mana pun, termasuk Indonesia, berupaya menekan kemiskinan. Indonesia sudah memiliki Badan Percepatan Pengentasan Kemiskinan.
Langkah awal adalah membentuk protokol data tunggal sebagai basis berbagai program untuk menekan angka kemiskinan. Keberadaan data ini diharapkan mendukung target menekan angka kemiskinan menjadi 4,5-5 persen dari jumlah penduduk.
Meski demikian, bantuan sosial saja tak cukup untuk membuat kemiskinan menjauh. Data BPS menunjukkan bahwa meskipun bantuan sosial terus digulirkan dalam lima tahun terakhir, jumlah penduduk miskin tetap tinggi, yakni mencapai 24,06 juta jiwa pada 2024. Bahkan, sebagian besar penerima bantuan sosial masih berada dalam kategori miskin setelah lebih dari tiga tahun mendapatkan bantuan. Penurunan jumlah penduduk miskin dari tahun ke tahun relatif lambat dan tidak cukup signifikan tanpa dukungan akses terhadap sumber daya produktif. Akses terhadap sumber daya, antara lain fasilitas pendidikan dan kesehatan, juga harus terjamin. Selain itu, tersedia lapangan kerja yang memberikan pendapatan layak bagi masyarakat.
Sumber: kompas.id, “Beranjak dari Kemiskinan” (dengan pengubahan seperlunya)`,
bat:`Batik, Pakaian Resmi, dan Aspek Keberlanjutan
Fenomena menarik terjadi saat penyelenggaraan Research and Development 20 Summer School 2024 tentang transisi energi. Peserta dari negara empat musim tampak kedinginan di ballroom hotel meskipun berasal dari negara dingin. Hal ini terjadi karena ketidaksesuaian antara pengaturan suhu ruangan dengan pakaian yang dikenakan.
Dalam konsep kenyamanan termal, pakaian menjadi salah satu faktor penting. Menurut ASHRAE, pakaian dengan nilai clo rendah tidak cocok untuk suhu ruang yang disetel dingin. Di negara tropis, pengaturan suhu yang terlalu rendah dapat menyebabkan pemborosan energi. Hal ini terjadi karena biasanya orang-orang memakai pakaian tebal, seperti jas. Ironisnya, budaya berpakaian formal di Indonesia masih mengandalkan jas sebagai standar, padahal penggunaan jas kurang sesuai dengan iklim tropis. Batik telah diakui UNESCO sebagai Warisan Budaya Tak Benda bisa menjadi solusi elegan sekaligus ramah lingkungan. Batik memiliki bahan dan corak yang lebih sesuai dengan suhu tropis. Selain itu, penggunaan batik juga dapat mendukung efisiensi energi dan tidak menuntut suhu ruangan yang terlalu rendah.
Penyesuaian ini bukan hanya tentang kenyamanan dalam mengenakan pakaian, melainkan juga tentang keberlanjutan. Penurunan suhu ruangan satu derajat celcius bisa menghasilkan emisi 160 kg CO₂ per tahun. Bayangkan dampaknya jika diterapkan di hotel atau gedung perkantoran.
Setiap lembar batik yang dikenakan menghidupi pengrajin, pelestari budaya, dan sektor UMKM kreatif. Bagi industri lokal, penggunaan batik secara luas dapat menjadi dorongan agar berkembang lebih pesat. Pemerintah dapat mendorong perubahan ini dengan menetapkan kebijakan yang memprioritaskan batik dalam acara resmi. Lembaga pendidikan dan instansi pemerintah juga bisa menjadi pelopor gerakan batik harian. Selain efisiensi energi, langkah ini juga memperkuat identitas nasional. Budaya bisa menjadi solusi atas krisis global, termasuk krisis iklim. Batik bukan sekadar pakaian, tetapi pernyataan sikap atas masa depan yang lestari.
Sudah saatnya, Indonesia menetapkan batik sebagai pakaian resmi dalam berbagai forum formal. Bahkan, batik akan lebih kuat jika digunakan dalam acara pelantikan, bukan jas. Hal ini akan menjadi simbol kuat keberlanjutan sekaligus kebanggaan nasional. Dengan memilih batik, kita tidak hanya melestarikan budaya, tetapi juga mengambil langkah konkret dalam menjaga bumi bagi generasi mendatang.

inf:`Inflasi Daerah-Daerah Indonesia
Kajian mengenai fenomena persistensi menjadi sangat penting untuk dilakukan dalam rangka mendukung perumusan kebijakan moneter yang efektif. Hal ini agar efektivitas kebijakan moneter dapat mendukung pertumbuhan ekonomi yang berkesinambungan dalam rangka meningkatkan kesejahteraan masyarakat. Inflasi yang tinggi akan memberikan dampak negatif terhadap perekonomian. Daya beli masyarakat menurun dan pelaku dunia usaha akan diliputi ketidakpastian yang tinggi. Implikasi dari persistensi inflasi tersebut juga akan dirasakan di tingkat daerah sehingga perlu mendapat perhatian pemerintah daerah setempat untuk dapat berperan aktif dalam mengendalikan inflasi. Kajian tersebut pada akhirnya diperlukan untuk merumuskan strategi pengendalian inflasi. Sumber tekanan inflasi yang menyebabkan persistensi inflasi perlu dianalisis secara lebih tajam sehingga dapat dibedakan sumber tekanan inflasi yang bersifat fundamental dan yang hanya bersifat sementara atau temporer.
Kebijakan moneter tidak dapat digunakan sepenuhnya untuk merespon tekanan inflasi dari kejutan di sisi pasokan. Diperlukan kebijakan sektoral dan regional untuk mengurangi tekanan inflasi dari faktor-faktor nonfundamental. Beberapa studi persistensi inflasi yang telah dilakukan sebelumnya di Indonesia lebih difokuskan pada skala nasional. Inflasi nasional merupakan rata-rata tertimbang dari inflasi daerah di Indonesia, maka dirasa perlu untuk mempelajari perilaku inflasi di tingkat daerah, termasuk mengukur dan mencari penyebabnya, serta mengetahui implikasinya terhadap pengendalian inflasi daerah dengan fokus kota Jakarta.
Pemilihan wilayah Jakarta didasarkan pada dominasinya terhadap bobot inflasi nasional dibandingkan dengan daerah lainnya di Indonesia. Meskipun terdapat kecenderungan yang menurun, bobot inflasi kota Jakarta masih merupakan yang terbesar di antara 66 kota yang diukur melalui Survei Biaya Hidup (SBH). Data tahun 2007 menunjukkan bahwa bobot Jakarta mencapai 22,49% dari bobot nasional (Grafik 1), menurun dari 27,66% berdasarkan SBH tahun 2002. Alasan lainnya adalah pergerakan volume distribusi barang kebutuhan pokok yang sangat tinggi di Jakarta. Selanjutnya, perilaku inflasi di Jakarta tersebut akan dibandingkan secara nasional dengan panel 10 daerah yang memiliki kontribusi inflasi tertinggi di Indonesia. Untuk menjawab tujuan penelitian, cakupan rentang waktu studi meliputi periode Januari 2000 s.d. Mei 2008 (Jakarta) dan Januari 2000 s.d. Desember 2009 (nasional). Hal ini terkait dengan ketersediaan data dari BPS hingga di level komoditinya yang dapat dilihat pada tabel berikut.
<b>Tabel Bobot Inflasi Kota Menurut SBH 2007</b><table><tr><th>Wilayah</th><th>Bobot Inflasi (%)</th></tr><tr><td>Jakarta</td><td>22,49</td></tr><tr><td>Surabaya</td><td>6,47</td></tr><tr><td>Semarang</td><td>3,48</td></tr><tr><td>Makassar</td><td>2,56</td></tr><tr><td>Palembang</td><td>2,96</td></tr><tr><td>Padang</td><td>1,69</td></tr><tr><td>Banjarmasin</td><td>1,54</td></tr><tr><td>Denpasar</td><td>1,53</td></tr><tr><td>Gabungan 56 Kota Lainnya</td><td>47,23</td></tr></table>`,
wm:`Wacana 1 – Metamorfosis
Begitu tiba di Brescia menjelang malam hari kami bermaksud mencapai jalan yang kami tuju dengan cepat, yang dalam pandangan kami cukup jauh letaknya. Sopir taksi meminta ongkos 3 lira, yang kami tawar 2 lira saja. Ia menolak ongkos 2 lira dan hanya berdasarkan keakraban ia gambarkan pada kami terpencilnya tempat itu. Mobil yang kami tumpangi membelok tiga kali melalui jalan pendek dan sampailah kami di tempat itu.
Otto yang paling bersemangat di antara kami mengatakan bahwa ia sama sekali tidak bermaksud membayar 3 lira untuk perjalanan yang pendek tersebut. Satu lira kiranya lebih dari cukup sebagai upah sang pengemudi. Kata Otto: “Daftar ongkos atau polisi.” “Daftar ongkos?” tanya sopir, tak ada daftar ongkos—Bagaimana ada daftar ongkos untuk jarak sependek ini—Ini adalah persetujuan mengenai perjalanan malam, tapi jika kita beri 2 lira ia akan rela. Otto berteriak dengan suara keras, “Daftar tarif atau polisi kami panggil ke sini.” Beberapa teriakan tajam kemudian daftar ongkos itu diperlihatkan, sudah kotor sehingga tak terbaca.
Akhirnya kami setuju memberinya 1,5 lira sebagai ongkos dan taksi kembali berjalan melalui jalan sempit, di mana ia terlihat geram dan juga sangat sedih. Tingkah laku seperti yang kami lakukan ini sayang sekali tidak bisa dikatakan tepat, dan siapa pun tidak bisa seenaknya bertindak seperti itu di Italia. Mungkin tidak apa-apa bila terjadi di tempat lain, namun tidak di Italia. Siapa bisa berpikir dengan jernih di tengah panasnya hawa seperti ini.
(Dikutip dari Novel Metamorfosis karya Franz Kafka)

Wacana 2 – Bumi Manusia
Aku dan Mama lari memapahnya menggantikan perempuan itu. Tetapi lelaki Indo dan perempuan Eropa itu menolak kami.
Di bawah tangga telah berkerumun Maresose. Dan kami dihalau tak boleh mendekat. Maka kami hanya dapat melihat makhluk tersayang itu dituntun seperti sapi, dan berjalan lambat-lambat, anak tangga demi anak tangga. Mungkin begini juga perasaan Ibu Mama diperlakukan oleh Mama dulu karena tak mampu membelanya dari kekuasaan Tuan Mellema. Tapi bagaimana perasaan Annelies? Benarkah dia sudah melepaskan segalanya, juga perasaannya sendiri?
Sebegini lemah pribumi di hadapan Eropa? Eropa! Kau, guruku, begini macam perbuatanmu? Sampai-sampai istriku yang tak tahu banyak tentangmu kini kehilangan kepercayaan pada dunianya yang kecil - dunia tanpa keamanan dan jaminan bagi dirinya seorang. Hanya seorang.
Aku panggil-panggil dia. Annelies tidak menjawab. Menoleh pun tidak.
“Aku akan segera menyusul, Ann,” pekikku. Tanpa jawab tanpa toleh.
“Juga aku, Ann, besarkan hatimu!” seru Mama, suaranya parau, hampir-hampir tak keluar dari kerongkongan. Juga tanpa jawab dan toleh.
Sebuah kereta Gubermen telah menunggu dalam apitan Maresose berkuda. Mama dan aku tak diperkenankan melewati pintu itu.
Sayup-sayup terdengar roda kereta mengelilingi kerikil, makin lama makin jauh, akhirnya tak terdengar lagi. Annelies dalam pelayaran ke negeri di mana Sri Ratu Wilhelmina bertahta. Kami menundukkan kepala di belakang pintu.
“Kita kalah, Ma,” bisikku.
“Kita telah melawan, Nak, Nyo, sebaik-baiknya, sehormat-hormatnya.”
(Dikutip dari Novel Bumi Manusia karya Pramoedya Ananta Toer)`,
wp:`Wacana 1 – Orang-Orang Proyek
Sugeng adalah seorang mandor proyek pembangunan jembatan di desa terpencil. Ia bekerja dengan dedikasi tinggi, karena tahu jembatan itu penting untuk akses ekonomi warga. Namun, di balik kemajuan proyek, ia menyaksikan penyimpangan: bahan bangunan dikurangi, upah buruh dipotong diam-diam, dan laporan keuangan dimanipulasi agar tampak bersih.
Suatu malam, Sugeng berbincang dengan Darno, kepala tukang.
“Gimana, Sugeng? Kita diam aja?” tanya Darno ragu.
“Kalau ngomong, kita bisa dipecat. Tapi kalau diam, kita ikut mencuri dari rakyat,” jawab Sugeng pelan.
Sugeng sadar ia hidup dalam dilema. Ia butuh pekerjaan itu untuk keluarganya, tetapi juga tidak rela melihat keadilan diinjak-injak. Tekanan moral dan sosial bertarung dalam batinnya. Pada akhirnya, ia memutuskan menolak tanda tangan laporan palsu, meski tahu risikonya.
(Diadaptasi dari Novel Orang-Orang Proyek karya Ahmad Tohari dengan pengubahan seperlunya)

Wacana 2 – A Long Walk to Water
Salva, anak laki-laki Sudan Selatan, terpisah dari keluarganya saat perang sipil meletus. Ia berjalan berhari-hari tanpa arah, melewati padang tandus, kelaparan, dan ancaman serangan. Selama bertahun-tahun, ia tinggal di kamp pengungsi, belajar bertahan dengan harapan kecil.
Saat dewasa dan tinggal di Amerika, Salva memutuskan kembali ke Sudan. Ia tak ingin hanya dikenal sebagai penyintas, tetapi sebagai orang yang memberi harapan. Bersama organisasi kemanusiaan, ia membangun sumur air bersih untuk desa-desa yang dulu mengalami kekeringan parah.
Seorang anak bertanya, “Kenapa kamu kembali?”
“Karena saya tahu rasanya haus. Dan saya tidak mau ada anak lain merasakannya,” jawab Salva.
Kembali ke tanah kelahirannya bukan tanpa rasa sakit. Tapi Salva percaya: dari luka bisa tumbuh kekuatan. Baginya, membantu orang lain adalah wujud paling nyata dari rasa syukur dan keteguhan.
(Diadaptasi dari novel A Long Walk to Water karya Linda Sue Park dengan pengubahan seperlunya)`,
pan:`Wacana 1 – Ulasan Pengunjung Pantai Karang Jahe (4,0 dari 5 · 16 ulasan · #4 dari 18 hal yang dapat dilakukan di Rembang)

Beragam aktivitas menarik tersedia, mulai dari bermain pasir, berenang, hingga naik wahana seperti banana boat dan kereta kuda. Fasilitas yang lengkap dan akses jalan yang mudah menambah kenyamanan berlibur.

(Sumber: visitjawatengah.jatengprov.go.id, dengan perubahan)`,

/* ===== PILIHAN PAKET 2 ===== */
pb:`(1) Mengapa banyak petani yang menggunakan benih asalan, namun tidak merasa sudah dirugikan? (2) Ada anggapan yang keliru oleh para petani. (3) Jika kebun menggunakan benih palsu, dipastikan tidak akan menghasilkan buah.
(4) Kenyataannya tidak demikian. (5) Tanaman asal benih palsu juga menghasilkan buah. (6) Masalahnya, kebanyakan petani merasa sukses ketika tanaman sudah menghasilkan, tanpa pernah menghitung berapa hasil aktual yang sesungguhnya ia peroleh. (7) Kerugian akibat benih palsu akan terlihat jika petani melakukan perhitungan terhadap hasil panen. (8) Umumnya, produksi kebun yang menggunakan bahan tanam asalan, mengacu pada penelitian PPKS. (9) Hanya 50 persen hasil yang bisa dicapai jika menggunakan benih bermutu.
(10) Petani kelapa sawit di salah satu Kabupaten di Sumatra Utara, melalui sebuah penelitian LSM kelapa sawit, hanya bisa memperoleh hasil sepuluh ton TBS/hektare/tahun meskipun umur tanamannya sudah mencapai 14 tahun. (11) Padahal, jika menggunakan benih bermutu, petani bisa meraih produksi hingga 20 ton/hektare/tahun sekalipun dengan pemeliharaan yang kurang baik. (12) Produksi pun bisa mencapai 30 ton TBS/hektare/tahun, bahkan 35 ton TBS/hektare/tahun jika melakukan pemeliharaan yang intensif. (13) Dengan harga TBS Rp1.500,00/kilogram, dengan menggunakan benih palsu, maka petani kehilangan pendapatan hingga Rp15 juta/hektare setiap tahunnya dengan asumsi kehilangan hasil sepuluh ton per hektare. (14) Oleh sebab itu, kerugian akibat menggunakan benih palsu tidak selalu berupa tanaman tidak menghasilkan. (15) Bisa saja tanaman menghasilkan, tetapi produktivitasnya jauh di bawah tanaman yang berasal dari benih bermutu.
(Diadaptasi dari disbun.kaltimprov.go.id)`,
hu:`Puisi “Huesca” karya John Cornford (diterjemahkan oleh Chairil Anwar)
Huesca jiwa di dunia yang hilang
jiwa jiwa sayang, kenangan padamu
adalah derita di sisiku
bayangan yang bikin tinjauan beku

angin bangkit ketika senja

air:`Teks 1A
(1) Masalah air bersih merupakan hal yang paling fatal bagi kehidupan kita. (2) Setiap hari kita membutuhkan air bersih untuk minum, sekaligus digunakan untuk memasak, mandi, mencuci dan sebagainya. (3) Dengan air yang bersih tentunya membuat kita terhindar dari penyakit. (4) Seperti kita tahu, saat ini masalah air bersih merupakan barang yang langka di negeri tercinta kita ini, apalagi di kota-kota besar seperti Jakarta, air bersih merupakan barang yang mahal dan sering diperjual belikan. (5) Tidak seperti halnya beberapa puluh tahun yang lalu, air bersih mudah diperoleh dan selalu berlimpah mengalir di setiap sudut tanah negeri kita ini. (6) Ini disebabkan karena pada waktu itu belum banyak terjadi polusi air dan udara. (7) Dari rasa dan warnanya pun saat ini berbeda, tidak sealami dulu karena polusi tersebut.

Teks 1B
(1) Berikut adalah beberapa faedah air bagi tubuh. (2) Apabila asupan air mencukupi, hal ini dapat membantu agar distribusi nutrisi ke seluruh tubuh menjadi lancar sehingga semua sel dalam tubuh dapat memperbaiki diri dengan nutrisi tersebut. (3) Dengan meminum air sesuai anjuran, juga akan meringankan kerja ginjal dan hati sehingga dapat membantu kita terhindar dari penyakit ginjal dan hati. (4) Meminum air dapat membantu pembuangan racun hasil metabolisme lebih lancar. (5) Ini akan membantu kita terhindar dari penyakit pencernaan, seperti sakit maag dan sembelit. (6) Kekurangan air akan membuat kulit kita terlihat kering dan berkerut. (7) Air akan membantu menjaga kulit agar tetap kenyal sehingga terlihat awet muda dan cantik alami. (8) Air dapat menurunkan berat badan karena tidak berkalori, bebas lemak, bebas kolesterol, dan rendah natrium. (9) Selain itu, air membantu tubuh menguraikan lemak yang tersimpan`,
km:`(1) Kesehatan mental merupakan istilah yang menjadi topik pembicaraan hangat akhir-akhir ini. (2) Beragam kasus bunuh diri di kalangan artis dan remaja, kasus perundungan dan dampaknya, serta penyintas depresi dan bipolar yang berani bersuara berhasil meningkatkan kesadaran masyarakat tentang kesehatan mental, khususnya di kalangan generasi Y dan Z sebagai generasi yang memasuki usia produktif saat ini. (3) Hal ini tak terlepas dari teknologi digital yang memiliki andil cukup besar terhadap peningkatan kesadaran tersebut. (4) Generasi ini memilih media digital untuk mencari informasi mengenai kesehatan mental.
(1) Berdasarkan data dari Google Trends, kata pencarian terkait kesehatan mental yang menduduki posisi tiga teratas selama 12 bulan terakhir adalah “kesehatan”, “gangguan jiwa” dan “kesehatan mental”. (2) Pencarian yang meningkat tajam berkaitan dengan pertanyaan tentang kesehatan mental adalah pencarian dengan kata kunci “pidato tentang kesehatan mental”, “skor kesehatan mental”, dan “kesehatan mental remaja pada era globalisasi” (2020, Januari). (3) Peningkatan literasi kesehatan mental dapat juga dilihat dari hasil penelitian komunitas Halo Jiwa Indonesia (2019) terhadap 501 mahasiswa dari berbagai provinsi di Indonesia. (4) Sebanyak 54% dari responden memiliki tingkat literasi kesehatan mental yang tinggi. (5) Tidak ada perbedaan antara literasi kesehatan mental laki-laki dan perempuan yang ditemukan. (6) Sebagai mahasiswa yang umumnya tergolong generasi Y dan Z, perkembangan internet mendukung peningkatan literasi kesehatan mental mereka.
(1) Namun, setiap solusi akan memiliki dua sisi, bukan? (2) Sisi negatif dari perkembangan ini adalah informasi berlebihan, yang beberapa di antaranya bisa saja salah kaprah atau keliru. (3) Kebanyakan masyarakat awam mungkin menganggap bahwa kesehatan mental adalah keadaan tidak adanya “penyakit” mental. (4) Apabila seseorang tidak didiagnosa mengidap gangguan-gangguan mental seperti yang terdaftar pada DSM (<i>Diagnostic and Statistical Manual of Mental Disorders</i>) yang dikeluarkan oleh American Psychological Association (APA), ICD (<i>The International Statistical Classification of Diseases</i>) dari WHO, ataupun PPDGJ (<i>Pedoman Penggolongan dan Diagnosis Gangguan Jiwa</i>) keluaran Departemen Kesehatan, orang tersebut masih sehat mentalnya. (5) Dari kacamata orang awam, asalkan Anda tidak termasuk “orang gila”, berarti Anda sehat mental. (6) Definisi ini sangatlah membatasi makna kesehatan mental itu sendiri dan boleh dikatakan fitrah sebagai seorang manusia.
(Diadaptasi dari kompasiana.com)`,
ko:`PENCEGAHAN PENYEBARAN KORONA DI TEMPAT KERJA
1) DILARANG MASUK jika Anda atau anggota keluarga Anda memiliki gejala KORONA.
2) Hanya yang memiliki izin yang boleh masuk!
3) Semua pengunjung dan pengemudi harus melapor ke Bagian Penerimaan.
4) Jaga jarak sejauh 2 meter dari orang lain.
5) Kenakan Alat Pelindung Diri (APD) sesuai ketentuan.
6) PERINGATAN: Dilarang saling meminjam APD atau peralatan lainnya! Hubungi Kepala Unit K3.
7) Seluruh permukaan harus dibersihkan dengan disinfektan secara teratur.
8) Cuci tangan minimal selama 20 detik secara teratur.
9) Ikuti semua instruksi dan petunjuk.
10) Hindari kontak langsung dengan orang lain. Rapat dilakukan hanya secara daring!`,
bi:`Untuk pertama kali, sejak November 2018 atau 45 bulan, Bank Indonesia (BI) menaikkan suku bunga acuan (BI rate). Kenaikan tersebut mematahkan ekspektasi pasar yang memperkirakan BI akan tetap mempertahankan suku bunga acuan. Bank sentral beralasan kenaikan suku bunga acuan merupakan bagian dari langkah untuk memitigasi risiko peningkatan inflasi inti dan ekspektasi inflasi akibat kenaikan harga bahan bakar minyak (BBM) nonsubsidi dan volatile food.
Kenaikan suku bunga acuan BI ini tentu saja akan berdampak pada keberlangsungan hidup masyarakat awam. Hal ini disebabkan masih banyak masyarakat yang bergantung pada utang. Sementara itu, suku bunga kredit perbankan akan naik menyesuaikan suku bunga acuan yang naik 25 basis poin, dari 3,5% menjadi 3,75%. Masyarakat tidak hanya harus menanggung beban bunga yang bertambah, tetapi juga semakin tertekan lantaran biaya hidup yang naik karena tingkat inflasi tinggi. Akibatnya, masyarakat berpotensi menahan anggaran belanjanya. Itu artinya bahwa keinginan untuk “menggairahkan” daya beli bisa kembali tertekan.
Imbas kenaikan suku bunga acuan BI lainnya juga dirasakan oleh pemerintah melalui suku bunga utang pemerintah yang semakin naik. Salah satu variabel penentu suku bunga utang pemerintah di Surat Berharga Negara (SBN) ialah suku bunga acuan BI. Dengan kenaikan ini, suku bunga SBN pemerintah akan ikut naik sehingga pemerintah harus membayar imbal hasil SBN ke investor lebih mahal.

mt:`(1) Kementerian Agraria dan Tata Ruang/Badan Pertanahan Nasional (ATR/BPN) mengungkapkan lima oknum pejabat yang terlibat dalam konflik mafia tanah, termasuk di lingkungan BPN hingga mitra kerjanya sendiri, yakni Pejabat Pembuat Akta Tanah (PPAT). (2) Menteri ATR/BPN, Hadi Tjahjanto, mengatakan bahwa sudah banyak laporan dari masyarakat yang masuk terkait keterlibatan PPAT dalam kasus pelik soal pertanahan di tanah air ini. (3) “Dari hasil yang saya dapatkan di lapangan, ada lima oknum mafia tanah yang bermain,” kata Hadi, dikutip dari laman resmi Kementerian ATR/BPN, Jumat (7 Oktober 2022).
(1) Pertama, yaitu oknum pegawai BPN, yang sampai saat ini masih terus ditertibkan agar tidak lagi terjerumus kegiatan mafia tanah. (2) Kedua, oknum pengacara. (6) Ketiga adalah oknum PPAT. (3) Untuk diketahui, PPAT sendiri memiliki tugas untuk melakukan sosialisasi program prioritas Kementerian ATR/BPN, yakni pencepatan pendaftaran tanah melalui Pendaftaran Tanah Sistematis Lengkap (PTSL) dan menyelesaikan kasus sengketa hingga memberantas mafia tanah. (4) “Kalau ada yang ketahuan, ingat janji saya, pasti selesai!” ujar Hadi.
(1) Tak hanya itu, Hadi juga membeberkan oknum keempat, yaitu camat sebagai PPAT sementara dan kelima adalah oknum kepala desa. (2) Menurutnya, kelima oknum ini bekerja sama dalam melakukan modus-modus penipuan dan pengalihan hak kepemilikan tanah. (3) “Apabila dari lima oknum ini salah satu saja tidak melakukan kegiatan maka sebetulnya mafia tanah ini tidak akan bisa jalan, karena mafia tanah ini tidak bisa jalan sendirian,” ungkapnya. (4) Hadi mendapat pemasukan dari masyarakat terkait dengan pengurusan PPAT. (5) Keluhan didominasi biaya layanan yang terlalu mahal dan tidak seragam, bahkan proses pelayanan pertanahan oleh lembaga tersebut pun terbilang lama.

sd:`(1) Amaralina, seorang dokter kulit dan kecantikan, berkeinginan untuk mengajak masyarakat luas peduli dengan lingkungan, terutama limbah sedotan plastik. (2) Ia merancang sendiri sedotan pakai ulang dari bahan kaca yang menjadi sedotan kaca pertama buatan Indonesia yang memiliki standar alat laboratorium kedokteran. (3) “Saya meminta rekan saya yang biasa memproduksi alat-alat kedokteran dan laboratorium untuk membuat sedotan dari bahan kaca. (4) Amaralina memilih membuat sedotan pakai ulang dari bahan kaca karena dinilai lebih higienis dan tahan lama. (5) Sedotan itu akan dipasarkan sepasang dengan sikat bulu sebagai alat pembersih sedotan. (6) Sikat yang digunakan untuk membersihkan sedotan terbuat dari bahan alami berupa bulu sapi atau bulu kuda. (7) “Karena terbuat dari kaca, jadi bisa terlihat apakah bersih atau kotor bagian dalamnya. (8) Saya juga merancang sikat pembersihnya agar benar-benar pas sehingga bisa membersihkan secara sempurna,” tambahnya lagi.
(1) Sementara itu, komunitas peduli lingkungan di Gianyar, Bali, menjadi salah satu komunitas yang memproduksi sedotan pakai ulang dari bambu. (2) Dengan nama Griya Luhu, mereka memilih menggunakan bambu buluh yang berdiameter kecil sebagai bahan utama sedotan mereka. (3) Mandhara Brasika, pendiri Griya Luhu, mengatakan bahwa awalnya sedotan bambu yang mereka buat hanya ditujukan sebagai barang suvenir.
(1) Bahan baku yang melimpah dan proses pembuatan yang sederhana membuat harga sedotan dari bambu buluh lebih terjangkau. (2) Para pemilik hotel dan rumah makan lokal biasanya menyediakan sedotan sekali pakai. (3) Bahkan, untuk memenuhi tuntutan kepedulian lingkungan, mereka memakai sedotan pakai ulang dari <i>stainless steel</i> atau kaca. (4) Mandhara mengatakan bahwa sedotan bambu buluh dirawat dengan baik, maka sedotan tersebut bisa bertahan 3 Bulan atau maksimal 6 Bulan. (5) Sejak setahun terakhir, sedotan tersebut banyak diminati pengelola hotel dan restoran di Pulau Dewata dan sejumlah kota lainnya. (6) “Karena Bali daerah wisata dan banyak tamu yang datang itu bule, mereka sudah paham bahaya limbah sedotan plastik. (7) Mereka juga sering menolak atau meminta sedotan daur ulang. (8) Jadi, ketika tahu ada sedotan bambu, pemilik dan pengelola hotel banyak memesannya baik untuk digunakan di tempat mereka maupun untuk souvenir,” kata Mandhara.

ck:`“Kamu sudah bijaksana; tapi kamu bukan anak biasa. Jutaan anak biasa di luar sana nggak sebijak kamu, dan mungkin saja membuat pilihan yang salah. Dan, kalau kesalahan dia, atau kesalahan kamu, menyakiti salah satu dari kalian, bisa saja itu membekas dan berdampak parah. Luka dari masa kecil itu lebih sulit disembuhkan daripada yang kamu dapat setelah dewasa.”
Aku mengangkat bahu. “Yang kubilang barusan adalah perspektif umum orang dewasa. Tapi, kamu yang menentukan apa yang mau kamu lakukan. Aku nggak kenal anak ini. Tapi, sebagai orang yang sayang kamu, aku akan otomatis menganggap kalau nggak ada anak yang sepadan untuk kamu.”
Suki mengeryit. “Jadi, menurut kamu, aku harus bilang nggak?”
“Nggak juga. Kalau kamu mau coba, silakan saja. Tapi, kamu harus tahu kalau nggak ada orang lain yang bisa menanggung risiko dari perbuatan yang kamu pilih. Jadi, anak kecil nggak akan memberikanmu pengecualian.”
“Jadi … kamu nggak memberi nasihat apa-apa?” tanya Suki.
Aku tertawa dan menggeleng. “Nggak. Menurutku, anak-anak harus dididik untuk belajar mengambil keputusan dan menanggung hasilnya. Tapi, kamu bukan anak biasa. Kamu sudah terbiasa menghadapi keputusan sulit. Tapi kalau nasihat, aku punya satu.
“Sejauh ini, kamu selalu mendasarkannya pada kebutuhan orang—pindah ke sini untuk menemani Abel, pindah ke Jepang untuk keluarga ibumu … Aku mau, untuk keputusan yang ini, pikirkan diri sendiri. Ambil keputusan berdasarkan keinginanmu, bukan apa yang diminta anak itu.
“Mungkin ini bukan waktunya lagi kamu belajar mengambil keputusan, tapi untuk membedakan jenis keputusan mana yang harus diambil berdasarkan kebutuhan orang, dan mana yang harus diambil berdasarkan kebutuhan kamu.” Aku tersenyum dan mengusap rambutnya lagi.

le:`Syarat-syarat lelang:
1) Peserta lelang/kuasanya harus hadir sebelum pada waktu pelaksanaan lelang. Acara lelang akan dimulai pada pukul 10.00 WIB.
2) Peserta lelang diwajibkan menyetor uang jaminan sebanyak Rp10.000.000,00 (sepuluh juta rupiah) ke rekening KP2LN Surakarta dengan nomor rekening 0035032726 di Bank BNI Cabang Surakarta. Uang tersebut wajib dibayar paling lambat 1 (satu) hari sebelum dilaksanakan lelang/tunai pada saat pelaksanaan lelang.
3) Bagi pemenang lelang yang ditunjuk wajib dan harus melunasi pembayaran secara tunai paling lambat 3 (tiga) hari kerja setelah lelang.
4) Bagi peserta yang tidak ditunjuk sebagai pemenang uang jaminan dikembalikan oleh pejabat lelang setempat.
5) Penjelasan lebih lanjut dapat menghubungi KP2LN Surakarta (Telepon: 0271723644).`,
bm:`(1) Langkah pemerintah menaikkan harga bahan bakar minyak (BBM) terus menuai pergolakan di masyarakat. (2) Kebijakan tersebut dinilai akan semakin membuat ekonomi masyarakat tercekik. (3) Berbagai desakan agar pemerintah mencabut kenaikan harga BBM dilakukan sejumlah kalangan. (4) Penolakan yang marak dilakukan terhadap kenaikan harga BBM tersebut lantaran kondisi perekonomian masyarakat baru mulai pulih pascaditerkam pandemi Covid-19.
(1) Salah satu sektor yang disebut terdampak kenaikan harga BBM adalah pendidikan. (2) Sebab, harga BBM yang melonjak berpotensi memicu terjadinya pemutusan hubungan kerja (PHK). (3) Hal ini tentunya berdampak juga kepada para orang tua yang tidak mampu untuk membiayai pendidikan anaknya.
(1) Menanggapi hal itu, politikus asal Kota Depok, Afrizal A. Lana, menilai bahwa masih terlalu banyak pihak yang hanya berkutat pada upaya penolakan sehingga tidak ada jalan keluar untuk persoalan tersebut. (2) Menurutnya, salah satu solusi untuk mengatasi dampak kenaikan harga BBM adalah memaksimalkan standar pelayanan minimal (SPM). (3) Pasalnya, SPM merupakan pelayanan dasar yang wajib diberikan pemerintah. (4) Sebagai contoh, dalam penyusunan anggaran pendapatan dan belanja daerah (APBD), 20% dari total anggaran telah dialokasikan untuk pendidikan. (5) Artinya, anggaran tersebut harus dimanfaatkan secara maksimal untuk membantu masyarakat.
(Diadaptasi dari politik.rmol.id)`};

// k = indeks jawaban benar (0=A); m=1 kompleks; c=kategori [pernyataan...], k=array 1/0 (1 = kolom pertama, 0 = kolom kedua); cl=label kolom kategori
S["t3"]="Teks 3 – Sampah Plastik dan Jalan Keluarnya\n(1) Sampah plastik menjadi salah satu persoalan lingkungan terbesar di kota-kota Indonesia. Setiap hari, ribuan ton plastik berakhir di tempat pembuangan akhir dan sungai.\n(2) Dampak sampah plastik terasa pada banyak bidang. Di lingkungan, plastik membutuhkan waktu ratusan tahun untuk terurai dan mencemari tanah serta air. Bagi kesehatan, partikel mikroplastik dapat masuk ke rantai makanan. Secara ekonomi, banjir akibat saluran tersumbat menimbulkan kerugian bagi warga.\n(3) Sejumlah upaya telah dilakukan untuk mengatasinya. Bank sampah memungkinkan warga menukarkan plastik dengan tabungan. Sekolah mengajak murid membawa botol minum sendiri. Pemerintah daerah mulai membatasi kantong plastik sekali pakai di pusat perbelanjaan.\n(4) Meskipun demikian, upaya tersebut belum akan berhasil tanpa perubahan kebiasaan masyarakat. Mengurangi, memakai ulang, dan memilah sampah dari rumah adalah langkah paling sederhana yang dapat dilakukan semua orang.";
S["t4"]="Teks 4 – Tidur dan Prestasi Belajar\nPenelitian di sejumlah sekolah menengah menunjukkan bahwa siswa yang tidur kurang dari tujuh jam setiap malam lebih sulit berkonsentrasi di kelas. Nilai ulangan mereka cenderung lebih rendah dibandingkan teman-temannya yang cukup tidur. Selain itu, mereka lebih mudah merasa cemas dan lekas marah. Kebiasaan bermain ponsel hingga larut malam disebut sebagai penyebab terbesar kurangnya waktu tidur remaja. Oleh karena itu, ...\nRata-rata nilai ulangan berdasarkan lama tidur: kurang dari 6 jam = 68; 6–7 jam = 73; 7–8 jam = 82; lebih dari 8 jam = 80.";
S["t5"]="Teks 5 – Pengumuman\nPENGUMUMAN\nDalam rangka memperingati Hari Kemerdekaan, OSIS akan mengadakan lomba cerdas cermat pada hari Sabtu, 15 Agustus 2026, di aula sekolah. Lomba ini diikuti oleh perwakilan tiap kelas yang terdiri atas tiga orang. Pendaftaran dilakukan di ruang OSIS paling lambat tanggal 10 agustus 2026. Peserta diharapkan hadir tepat waktu karena acara dimulai pukul 08.00 WIB. Atas perhatian dan kerja samanya, kami ucapkan terima kasih.";
S["t6"]="Teks 6 – Puisi “Hujan di Terminal Sore”\nHujan menggantung di ujung atap terminal,\nlampu bus berkedip seperti mata yang lelah.\nSeorang ibu menggenggam tiket dan doa,\nmenunggu pulang yang tak pernah tepat waktu.";
S["t7"]="Teks 7 – Kutipan Naskah Drama “Amplop Cokelat”\nLatar: dapur sederhana, malam hari.\nDITA: (menaruh amplop di meja, suaranya bergetar) Bu, hasil seleksi beasiswanya sudah keluar.\nIBU: (berhenti mengaduk teh, menatap amplop tanpa berani menyentuhnya) Isinya … kabar baik, Nak?\nDITA: (menunduk lama) Aku tidak lolos, Bu. Maaf.\nIBU: (meraih tangan Dita, tersenyum getir) Jangan minta maaf. Ibu bangga kamu sudah berjuang sejauh ini.";

{s:"w2a",i:"2.1.1 · L2",q:"Gagasan utama yang mendasari seluruh isi Teks 1 adalah ….",o:["Pasar rakyat mulai menerapkan pembayaran nontunai yang bermanfaat meskipun sebagian pedagang masih memerlukan pendampingan.","Pembeli di pasar rakyat lebih suka membayar dengan uang kertas.","Bank daerah membuka cabang baru di dalam Pasar Wage.","Pedagang lanjut usia menolak sistem pembayaran yang baru.","Pencatatan penjualan di pasar rakyat sulit dilakukan."],k:[0]},

{s:"w2b",i:"3.1.1 · L3",q:"Peristiwa Bu Sari bekerja sejak subuh agar Laras dapat fokus belajar paling relevan dengan kehidupan sehari-hari berikut ….",o:["Seorang siswa membeli buku baru di toko buku.","Seorang pedagang menutup toko lebih awal pada hari libur.","Seorang warga memilih pindah ke kota lain.","Seorang ayah bekerja lembur agar anaknya dapat melanjutkan kuliah.","Seorang guru mengikuti pelatihan pada akhir pekan."],k:[3]},

{s:"w2a",i:"3.1.3 · L3",q:"Hikmah dari peristiwa dalam Teks 1 yang dapat diterapkan oleh masyarakat lain adalah ….",o:["Inovasi layanan perlu disertai pendampingan agar semua kalangan dapat memanfaatkannya.","Teknologi baru sebaiknya hanya diterapkan setelah semua orang mahir.","Pembayaran tunai harus segera dihapus dari semua pasar.","Pedagang lanjut usia sebaiknya berhenti berjualan.","Perubahan layanan tidak perlu disosialisasikan kepada pengguna."],k:[0]},
{s:"w2d",i:"3.2.1 · L3",q:"Berdasarkan tabel pada Teks 4, pernyataan yang paling sesuai dengan data adalah ….",o:["Jumlah kunjungan tahun 2023 lebih tinggi daripada tahun 2025.","Peminjaman lewat layanan antar buku pada tahun 2024 lebih banyak daripada tahun 2025.","Jumlah kunjungan tidak berubah dari tahun 2022 ke tahun 2023.","Jumlah kunjungan sebelum layanan antar buku lebih besar daripada sesudahnya.","Kenaikan jumlah kunjungan terbesar terjadi dari tahun 2023 ke tahun 2024."],k:[4]},
{s:"w2d",i:"3.2.2 · L3",m:1,q:"Teks 4 menyatakan bahwa layanan antar buku merupakan penyebab utama meningkatnya minat baca. Informasi tambahan yang diperlukan agar pernyataan tersebut cukup didukung adalah …. (Jawaban benar lebih dari satu.)",o:["Daftar judul buku yang paling banyak dipinjam","Hasil survei tentang alasan warga mengunjungi perpustakaan","Jumlah rak buku di ruang baca","Perbandingan kenaikan kunjungan sebelum dan sesudah penambahan koleksi buku anak dan perpanjangan jam buka","Data jumlah pengunjung baru yang mengenal perpustakaan melalui layanan antar buku"],k:[1,3,4]},
{s:"w2d",i:"3.2.3 · L2",c:["Peningkatan kunjungan hanya disebabkan oleh layanan antar buku.","Pada tahun yang sama perpustakaan menambah koleksi buku anak dan memperpanjang jam buka.","Pengelola menyimpulkan bahwa layanan antar buku merupakan penyebab utama meningkatnya minat baca."],k:[0,1,1],q:"Tentukan kesesuaian setiap kalimat ringkasan berikut dengan isi Teks 4!"},

{i:"3.3.2 · L2",q:"Perhatikan kalimat berikut!<br><i>Komunitas pemuda itu menggelar pentas seni secara rutin untuk ... warisan budaya daerah agar tidak punah.</i><br>Kata yang paling tepat untuk melengkapi kalimat tersebut adalah ….",o:["menggeser","melestarikan","meniadakan","melupakan","menukarkan"],k:[1]},
{i:"3.3.3 · L2",m:1,q:"Pilihlah semua kalimat yang telah efektif! (Jawaban benar lebih dari satu.)",o:["Para siswa-siswa mengikuti kegiatan itu dengan antusias.","Kepala sekolah menyampaikan apresiasi kepada seluruh peserta lomba.","Perpustakaan itu buka setiap hari kecuali hari Minggu.","Hal tersebut disebabkan karena faktor cuaca yang buruk.","Siswa yang terlambat wajib melapor kepada guru piket."],k:[1,2,4]},
{s:"w2e",i:"3.3.4 · L3",q:"Kalimat pembuka yang paling sesuai dengan ragam bahasa resmi untuk undangan seperti Teks 5 adalah ….",o:["Gimana kabarnya, Pak/Bu? Kita mau ngadain pertemuan nih.","Ayo, Bapak/Ibu, datang ya ke sekolah kami besok.","Kami cuma mau bilang kalau akan ada acara di sekolah.","Dengan hormat, kami mengundang Bapak/Ibu untuk menghadiri pertemuan orang tua murid.","Pokoknya Bapak/Ibu harus hadir karena acaranya penting banget."],k:[3]},
{s:"w2b",i:"3.4.1 · L3",q:"Kutipan dalam Teks 2 yang paling tepat menggambarkan karakter Bu Sari adalah ….",o:["Pukul empat subuh, dapur rumah Bu Sari sudah mengepul.","“Bu, Laras bantu ya,” kata Laras sambil mengucek mata.","Aroma bawang goreng dan minyak panas memenuhi ruangan yang sempit itu.","Namun, listrik tiba-tiba padam, dan dapur itu jatuh dalam gelap.","“Biar Ibu yang urus gorengan. Kamu cukup belajar yang rajin.”"],k:[4]},
{s:"w2b",i:"3.4.2 · L3",q:"Kutipan dalam Teks 2 yang paling tepat menggambarkan peristiwa yang menjadi hambatan bagi tokoh adalah ….",o:["Laras tidak beranjak.","Ia melihat punggung ibunya yang melengkung.","Namun, listrik tiba-tiba padam, dan dapur itu jatuh dalam gelap.","“Tidur lagi saja, Nduk. Hari ini kamu ujian,” jawab Bu Sari tanpa menoleh.","Pukul empat subuh, dapur rumah Bu Sari sudah mengepul."],k:[2]},
{s:"w2b",i:"3.4.3 · L3",m:1,q:"Pilihlah kutipan dalam Teks 2 yang merupakan gambaran latar! (Jawaban benar lebih dari satu.)",o:["Laras tidak beranjak.","Pukul empat subuh, dapur rumah Bu Sari sudah mengepul.","“Tidur lagi saja, Nduk. Hari ini kamu ujian.”","Aroma bawang goreng dan minyak panas memenuhi ruangan yang sempit itu.","Hari ini, ia berjanji dalam hati, nilai terbaik harus menjadi hadiah."],k:[1,3]},
{s:"w2f",i:"3.5.1 · L3",q:"Berdasarkan diksi dan citraan dalam puisi “Kemarau di Petak Sawah”, respons emosional yang paling tepat adalah ….",o:["gembira karena panen berlimpah","kesal karena petani malas bekerja","iba dan haru terhadap petani yang menanti hujan","bangga karena burung-burung kembali ke sarang","geli melihat tanah yang retak"],k:[2]},
{s:"w2b",i:"3.5.2 · L3",q:"Respons emosional yang paling sesuai terhadap penokohan dan konflik dalam Teks 2 adalah ….",o:["geli karena Bu Sari bersikap lucu","haru dan kagum terhadap pengorbanan Bu Sari serta tekad Laras","marah karena Laras mengabaikan ibunya","takut karena dapur terbakar","bosan karena ceritanya tidak jelas"],k:[1]},
